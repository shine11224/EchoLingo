    function togglePracticeMic(key) {
      const button = document.querySelector(`[data-practice-mic="${key}"]`);
      const input = document.querySelector(`[data-practice-input="${key}"]`);
      if (!button || !input) return;
      if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) {
        setPracticeMicStatus(key, '当前浏览器不支持录音输入', true);
        return;
      }
      if (activePracticeRecorder && activePracticeMicKey === Number(key)) {
        activePracticeRecorder.stop();
        return;
      }
      if (activePracticeRecorder) activePracticeRecorder.stop();

      navigator.mediaDevices.getUserMedia({audio: true}).then(stream => {
        const chunks = [];
        const recorder = new MediaRecorder(stream);
        activePracticeRecorder = recorder;
        activePracticeMicKey = Number(key);
        recorder.ondataavailable = event => {
          if (event.data.size > 0) chunks.push(event.data);
        };
        recorder.onstart = () => {
          button.textContent = '⏹';
          button.classList.add('recording');
          setPracticeMicStatus(key, '正在录音，说完后再次点击停止…');
        };
        recorder.onstop = async () => {
          stream.getTracks().forEach(track => track.stop());
          button.textContent = '🎤';
          button.classList.remove('recording');
          if (activePracticeRecorder === recorder) {
            activePracticeRecorder = null;
            activePracticeMicKey = null;
          }
          setPracticeMicStatus(key, '正在识别…');
          const form = new FormData();
          form.append('audio', new Blob(chunks, {type: recorder.mimeType || 'audio/webm'}), 'recording.webm');
          try {
            const response = await eltCredits.billableFetch('retell_transcribe', '/api/transcribe', {method: 'POST', body: form});
            const data = await response.json();
            if (!response.ok || !data.text) throw new Error(data.error || '识别失败，请重试');
            input.value += `${input.value && !input.value.endsWith(' ') ? ' ' : ''}${data.text}`;
            setPracticeMicStatus(key, '');
          } catch (error) {
            setPracticeMicStatus(key, error.message || '转写服务连接失败', true);
          }
        };
        recorder.start();
      }).catch(error => {
        const message = error.name === 'NotAllowedError'
          ? '麦克风权限被拒绝，请在浏览器地址栏允许'
          : `麦克风错误：${error.message}`;
        setPracticeMicStatus(key, message, true);
      });
    }

    function linkifyEnglish(text, key) {
      const tokens = String(text || '').match(/[A-Za-z]+(?:'[A-Za-z]+)?|[^A-Za-z]+/g) || [];
      return tokens.map(token => {
        if (!/^[A-Za-z]/.test(token)) return escapeHtml(token);
        const normalized = token.toLowerCase();
        return `<button class="word-token" type="button" data-word="${escapeHtml(normalized)}" data-key="${key}">${escapeHtml(token)}</button>`;
      }).join('');
    }

    function normalizeListItem(item) {
      if (typeof item === 'string') {
        const trimmed = item.trim();
        if (trimmed.startsWith('{') || trimmed.startsWith('[')) {
          try { return normalizeListItem(JSON.parse(trimmed)); } catch { return item; }
        }
        return item;
      }
      if (Array.isArray(item)) return item.map(normalizeListItem).filter(Boolean).join('；');
      if (item && typeof item === 'object') {
        if (item.word && item.difference) return `${item.word}：${item.difference}`;
        return Object.values(item).filter(Boolean).join('：');
      }
      return String(item ?? '');
    }

    function renderListValue(value, key, withExampleActions = false) {
      if (!Array.isArray(value)) return escapeHtml(normalizeListItem(value || ''));
      return value.map(item => {
        const text = normalizeListItem(item);
        if (!withExampleActions) return `<li>${linkifyEnglish(text, key)}</li>`;
        const encoded = encodeURIComponent(text);
        const savedId = savedSentenceMap.get(normSentenceKey(text));
        const saveAttrs = savedId
          ? `data-sentence-id="${savedId}" class="sentence-saved"`
          : '';
        const saveLabel = savedId ? '✓ 已收藏' : '☆ 收藏';
        return `<li class="word-example-item"><span>${linkifyEnglish(text, key)}</span><span class="word-example-actions">
          <button type="button" data-speak-example="${escapeHtml(encoded)}">🔊 朗读</button>
          <button type="button" data-save-example="${escapeHtml(encoded)}"${saveAttrs}>${saveLabel}</button>
        </span></li>`;
      }).join('');
    }

    function hasDeepWordAnalysis(data) {
      if (!data || typeof data !== 'object') return false;
      const detailFields = ['pos', 'register', 'contextual_meaning', 'en_definition', 'usage', 'ielts_note'];
      if (detailFields.some(field => String(data[field] || '').trim())) return true;
      return ['collocations', 'synonyms', 'examples'].some(field => Array.isArray(data[field]) && data[field].length);
    }

    function renderWordAnalysis(data, key) {
      if (data.error) return `<span style="color:var(--danger)">${escapeHtml(data.error)}</span>`;
      const word = String(data.word || '').toLowerCase();
      const saved = savedLessonWords.has(word);
      const rows = [
        ['词性', data.pos], ['语域', data.register], ['基本义', data.basic_meaning],
        ['语境义', data.contextual_meaning], ['英文释义', data.en_definition], ['用法', data.usage],
        ['雅思提示', data.ielts_note],
      ].filter(row => row[1]);
      const lists = [
        ['常见搭配', data.collocations], ['近义词辨析', data.synonyms], ['例句', data.examples],
      ].filter(row => Array.isArray(row[1]) && row[1].length);
      return `<div class="word-analysis">
        <div class="word-analysis-head">
          <h4>${escapeHtml(data.word || '')} <small>${escapeHtml(data.ipa || '')}</small></h4>
          <div class="word-analysis-actions">
            <button type="button" data-speak-word="${escapeHtml(word)}" data-key="${key}" aria-label="播放 ${escapeHtml(word)} 发音">🔊</button>
            <button class="word-save-button${saved ? ' saved' : ''}" type="button" data-toggle-word-save="${escapeHtml(word)}" data-key="${key}">${saved ? '★ 已收藏' : '☆ 收藏'}</button>
            <button type="button" data-close-word-analysis="${key}">收起</button>
          </div>
        </div>
        <div class="word-grid">
          ${rows.map(([label, value]) => `<div class="word-block full"><span class="word-label">${label}</span>${['英文释义', '用法'].includes(label) ? linkifyEnglish(value, key) : escapeHtml(value)}</div>`).join('')}
          ${lists.map(([label, value]) => `<div class="word-block full"><span class="word-label">${label}</span><ul>${renderListValue(value, key, label === '例句')}</ul></div>`).join('')}

      </div>`;

    function familiarityText(word) {
      if (knownWords.has(word)) return '已认识';
      const count = Number(vocabLog[word]?.count || 0);
      return count ? `已学习 ${count} 次` : '首次学习';
    }

    function renderIntensiveWordCard({word, key, meaning = '', phonetic = '', loading = false, error = ''}) {
      const saved = savedLessonWords.has(word);
      const inReviewBook = reviewBookWords.has(word);
      return `<div class="word-card-head">
          <div><h3 class="word-card-title">${escapeHtml(word)}</h3>${phonetic ? `<div class="word-card-phonetic">/${escapeHtml(phonetic.replace(/^\/+|\/+$/g, ''))}/</div>` : ''}</div>
          <div class="word-analysis-actions">
            <button type="button" data-speak-word="${escapeHtml(word)}" data-key="${key}" aria-label="播放 ${escapeHtml(word)} 发音">🔊</button>
            <button class="word-card-close" type="button" data-close-word-card aria-label="关闭词卡">✕</button>
          </div>
        </div>
        <div class="word-card-meaning"${error ? ' style="color:var(--danger)"' : ''}>${escapeHtml(error || (loading ? '正在查询释义…' : (meaning || '暂未命中本地释义')))}</div>
        <div class="word-card-status"><span>熟悉程度</span><strong>${escapeHtml(familiarityText(word))}</strong></div>
        <div class="word-card-actions">
          <button class="word-save-button${saved ? ' saved' : ''}" type="button" data-toggle-word-save="${escapeHtml(word)}" data-key="${key}">${saved ? '★ 已收藏' : '☆ 收藏'}</button>
          <button class="word-review-button${inReviewBook ? ' in-review' : ''}" type="button" data-add-word-review="${escapeHtml(word)}" data-review-meaning="${escapeHtml(meaning)}" ${inReviewBook || loading ? 'disabled' : ''}>${inReviewBook ? '✓ 已在复习本' : '＋ 加入复习本'}</button>
          <button type="button" data-mark-known="${escapeHtml(word)}">✓ 我认识</button>
          <button class="primary-action" type="button" data-study-word="${escapeHtml(word)}" data-key="${key}">深入学习</button>
        </div>`;
    }

    function positionIntensiveWordCard(anchor) {
      const card = document.getElementById('intensive-word-card');
      const rect = anchor.getBoundingClientRect();
      const cardRect = card.getBoundingClientRect();
      const below = rect.bottom + 9;
      const top = below + cardRect.height <= window.innerHeight - 12
        ? below
        : Math.max(12, rect.top - cardRect.height - 9);
      card.style.top = `${top}px`;
      card.style.left = `${Math.min(window.innerWidth - cardRect.width - 12, Math.max(12, rect.left))}px`;
    }

    async function openIntensiveWordCard(anchor, word, key) {
      const normalized = String(word || '').toLowerCase();
      const card = document.getElementById('intensive-word-card');
      if (!normalized || !sentenceByKey(key)) return;
      activeWordCard = {word: normalized, key: Number(key), anchor};
      const cached = vocabLog[normalized]?.cached_analysis || wordAnalysisCache.get(`${normalized}||${key}`);
      card.innerHTML = renderIntensiveWordCard({
        word: normalized,
        key,
        meaning: cached?.basic_meaning || '',
        phonetic: cached?.ipa || '',
        loading: !cached,
      });
      card.scrollTop = 0;
      card.classList.add('open');
      positionIntensiveWordCard(anchor);
      if (cached) return;
      try {
        const response = await fetch(`/api/v2/lessons/${LESSON_ID}/word-meaning/${encodeURIComponent(normalized)}`);
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || '释义查询失败');
        if (!activeWordCard || activeWordCard.word !== normalized || activeWordCard.key !== Number(key)) return;
        if (data.in_review_book) reviewBookWords.add(normalized);
        card.innerHTML = renderIntensiveWordCard({word: normalized, key, meaning: data.meaning || '', phonetic: data.phonetic || ''});
        card.scrollTop = 0;
        positionIntensiveWordCard(anchor);
      } catch (error) {
        card.innerHTML = renderIntensiveWordCard({word: normalized, key, error: error.message});
        card.scrollTop = 0;
      }
    }

    function closeIntensiveWordCard() {
      document.getElementById('intensive-word-card').classList.remove('open');
      activeWordCard = null;
    }

    async function addIntensiveWordToReview(word, meaning, button) {
      const normalized = String(word || '').toLowerCase();
      if (!normalized || !button || reviewBookWords.has(normalized)) return;
      button.disabled = true;
      button.textContent = '加入中…';
      try {
        const response = await fetch('/api/vocab-review/activate', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            word: normalized,
            source: 'intensive',
            lesson_id: LESSON_ID,
            meaning: String(meaning || ''),
          }),
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok || data.error) throw new Error(data.error || '加入复习本失败');
        reviewBookWords.add(String(data.word || normalized).toLowerCase());
        button.classList.add('in-review');
        button.textContent = '✓ 已在复习本';
      } catch (error) {
        button.disabled = false;
        button.textContent = '重试加入';
        window.alert(`加入复习本失败：${error.message}`);

    function speakIntensiveExample(encodedText) {
      const text = decodeURIComponent(encodedText || '');
      if (!text) return;
      NaturalTTS.speak(text, {lang:'en-US', rate:1});
    }

    async function saveIntensiveExample(button, encodedText) {
      const text = decodeURIComponent(encodedText || '');
      if (!text || !button) return;
      button.disabled = true;
      const sentenceId = Number(button.dataset.sentenceId || 0);
      try {
        if (sentenceId) {
          // 已收藏 → 取消收藏（归档）
          const response = await fetch(`/api/v2/lessons/sentence-review/${sentenceId}`, {
            method: 'PATCH',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({archived: true}),
          });
          const data = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(data.detail || data.error || '取消收藏失败');
          savedSentenceMap.delete(normSentenceKey(text));
          delete button.dataset.sentenceId;
          button.classList.remove('sentence-saved');
          button.textContent = '☆ 收藏';
        } else {
          const response = await fetch('/api/v2/lessons/sentence-review/manual', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({text}),
          });
          const data = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(data.detail || data.error || '收藏失败');
          const newId = data.sentence?.id;
          if (newId) {
            savedSentenceMap.set(normSentenceKey(text), newId);
            button.dataset.sentenceId = newId;
          }
          button.classList.add('sentence-saved');
          button.textContent = '✓ 已收藏';
        }
      } catch (error) {
        window.alert(`操作失败：${error.message}`);
      } finally {
        button.disabled = false;
      }
    }

    async function logIntensiveWordStudy(word, sentence, analysis) {
      const lessonResponse = await fetch(`/api/v2/lessons/${LESSON_ID}/word`, {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          word,
          meaning: analysis?.basic_meaning || '',
          sentence: sentence.text,
        }),
      });
      if (!lessonResponse.ok) throw new Error('课程生词保存失败');
      savedLessonWords.add(word);
      const response = await fetch('/log-word', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          word,
          sentence: sentence.text,
          lesson_title: intensiveDocument.lesson?.title || '逐句精读',
          level: 'v2',
          analysis,
        }),
      });
      const data = await response.json().catch(() => ({}));
      if (response.ok) vocabLog[word] = {...(vocabLog[word] || {}), count: data.count, cached_analysis: analysis};
      updateWordSaveControls(word);
      const highlighted = Array.isArray(sentence.highlighted_words) ? sentence.highlighted_words : [];
      if (!highlighted.includes(word)) highlighted.push(word);
      sentence.highlighted_words = highlighted;
    }

    async function analyzeIntensiveWord(word, key) {
      const normalized = String(word || '').toLowerCase();
      const sentence = sentenceByKey(key);
      const card = document.querySelector(`.sentence-card[data-key="${key}"]`);
      const result = card?.querySelector(`[data-word-result="${key}"]`);
      if (!sentence || !card || !result) return;
      const cacheKey = `${normalized}||${key}`;
      const hasSessionCache = wordAnalysisCache.has(cacheKey);
      const cached = hasSessionCache
        ? wordAnalysisCache.get(cacheKey)
        : vocabLog[normalized]?.cached_analysis;
      result.classList.add('open');
      closeIntensiveWordCard();
      if (hasSessionCache || hasDeepWordAnalysis(cached)) {
        wordAnalysisCache.set(cacheKey, cached);
        result.innerHTML = renderWordAnalysis(cached, key);
        result.scrollIntoView({behavior: 'smooth', block: 'nearest'});
        return;
      }
      result.innerHTML = `<div class="word-analysis-head"><h4>${escapeHtml(normalized)}</h4><div class="word-analysis-actions"><button type="button" data-speak-word="${escapeHtml(normalized)}" data-key="${key}" aria-label="播放 ${escapeHtml(normalized)} 发音">🔊</button><button type="button" data-close-word-analysis="${key}">收起</button></div></div><span class="filter-note">AI 正在生成语境解析…</span>`;
      try {
        const response = await eltCredits.billableFetch('word_analysis', '/analyze-word', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({word: normalized, sentence: sentence.text}),
        });
        const data = await response.json();
        if (!response.ok || data.error) throw new Error(data.error || '词汇解析失败');
        wordAnalysisCache.set(cacheKey, data);
        await logIntensiveWordStudy(normalized, sentence, data);
        const focusList = card.querySelector('.focus-word-list');
        if (focusList) focusList.innerHTML = renderFocusWordChips(sentence);
        if (!document.body.contains(result)) return;

      }

    function updateWordSaveControls(word) {
      const saved = savedLessonWords.has(word);
      document.querySelectorAll('[data-toggle-word-save]').forEach(button => {
        if (button.dataset.toggleWordSave !== word) return;
        button.classList.toggle('saved', saved);
        button.textContent = saved ? '★ 已收藏' : '☆ 收藏';
      });

    async function toggleIntensiveWordSaved(word, key) {
      const normalized = String(word || '').toLowerCase();
      const sentence = sentenceByKey(key);
      if (!normalized || !sentence) return;
      const saved = savedLessonWords.has(normalized);
      const analysis = wordAnalysisCache.get(`${normalized}||${key}`) || vocabLog[normalized]?.cached_analysis || {};
      const response = saved
        ? await fetch(`/api/v2/lessons/${LESSON_ID}/word/${encodeURIComponent(normalized)}`, {method: 'DELETE'})
        : await fetch(`/api/v2/lessons/${LESSON_ID}/word`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
              word: normalized,
              meaning: analysis.basic_meaning || '',
              sentence: sentence.text,
            }),
          });
      const data = await response.json().catch(() => ({}));
      if (!response.ok || data.error) throw new Error(data.detail || data.error || '词语收藏更新失败');
      if (saved) {
        savedLessonWords.delete(normalized);
        for (const item of intensiveDocument.sentences || []) {
          item.highlighted_words = sentenceFocusWords(item).filter(candidate => candidate !== normalized);
        }
      } else {
        savedLessonWords.add(normalized);
        const highlighted = Array.isArray(sentence.highlighted_words) ? sentence.highlighted_words : [];
        if (!highlighted.includes(normalized)) highlighted.push(normalized);
        sentence.highlighted_words = highlighted;
      }
      updateWordSaveControls(normalized);
      const card = document.querySelector(`.sentence-card[data-key="${key}"]`);
      const focusList = card?.querySelector('.focus-word-list');
      if (focusList) focusList.innerHTML = renderFocusWordChips(sentence);

    async function markIntensiveWordKnown(word) {
      const normalized = String(word || '').toLowerCase();
      if (!normalized) return;
      const [knownResponse, lessonResponse] = await Promise.all([
        fetch('/api/known-words', {
          method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({word: normalized}),
        }),
        fetch(`/api/v2/lessons/${LESSON_ID}/word/${encodeURIComponent(normalized)}`, {method: 'DELETE'}),
      ]);
      if (!knownResponse.ok || !lessonResponse.ok) throw new Error('熟悉度保存失败');
      knownWords.add(normalized);
      localStorage.setItem(`known_${normalized}`, '1');
      closeIntensiveWordCard();
      renderAll();
    }

    async function ensureSentenceSaved(sentence) {
      if (sentence.saved) return sentence.phase_b_key;
      const response = await fetch(`/api/v2/lessons/${LESSON_ID}/phase-b`, {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          segment_index: sentence.key,
          start_seconds: sentence.start_seconds || 0,
          end_seconds: sentence.end_seconds || 0,
          text: sentence.text,
        }),
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.detail || '收藏失败');
      sentence.saved = true;
      sentence.phase_b_key = Number(data.sentence.segment_index);
      sentence.sentence_id = Number(data.sentence.sentence_id);
      sentence.tags = data.sentence.tags || [];
      return sentence.phase_b_key;
    }

    async function saveSentenceTags(key) {
      const sentence = sentenceByKey(key);
      const category = document.querySelector(`[data-tag-category="${key}"]`)?.value;
      const selectedName = document.querySelector(`[data-tag-name="${key}"]`)?.value || '';
      const customName = document.querySelector(`[data-tag-custom="${key}"]`)?.value.trim() || '';
      const name = selectedName === CUSTOM_TAG_VALUE ? customName : selectedName;
      if (!sentence || !category || !name) return;
      try {
        const phaseBKey = await ensureSentenceSaved(sentence);
        const tags = sentenceTags(sentence).filter(tag => tag.category && tag.name);
        if (!tags.some(tag => tag.category === category && tag.name === name)) tags.push({category, name});
        const response = await fetch(`/api/v2/lessons/${LESSON_ID}/phase-b/${encodeURIComponent(phaseBKey)}/tags`, {
          method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({tags}),
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || data.error || '标签保存失败');
        sentence.tags = data.tags || tags;
        if (!tagCatalog.tags.some(tag => tag.name === name && tag.category === category)) tagCatalog.tags.push({name, category});
        renderAll();
      } catch (error) {
        window.alert(error.message);
      }
    }

    async function toggleSentenceSaved(key) {
      const sentence = sentenceByKey(key);
      if (!sentence) return;
      try {
        if (sentence.saved) {
          const response = await fetch(`/api/v2/lessons/${LESSON_ID}/phase-b/${encodeURIComponent(sentence.phase_b_key)}`, {method: 'DELETE'});
          if (!response.ok) throw new Error('取消收藏失败');
          sentence.saved = false;
          sentence.phase_b_key = sentence.key;
          sentence.tags = [];
        } else {
          await ensureSentenceSaved(sentence);
        }
        renderAll();
      } catch (error) {
        window.alert(error.message);
      }
    }

    function _wordlistsQuery() {
      const raw = localStorage.getItem('phase_a_user_wordlists');
      if (raw === null) return '';
      try {
        const arr = JSON.parse(raw);
        return '?wordlists=' + encodeURIComponent(Array.isArray(arr) ? arr.join(',') : '');
      } catch (e) { return ''; }
    }

    async function syncIntensiveHighlightedWords() {
      try {
        await fetch(`/api/v2/lessons/${LESSON_ID}/highlighted-words/sync${_wordlistsQuery()}`, {method: 'POST'});
      } catch (_) {
        // The intensive page should still open when the optional initial sync fails.
      }
    }

    function applyLessonAiRecommendation(rec) {
      lessonAiRecommendation = rec && typeof rec === 'object' ? rec : null;
      aiRecommendedWords.clear();
      aiRecommendedSentences.clear();
      aiWordReasons.clear();
      aiPatternByKey.clear();
      (lessonAiRecommendation?.words || []).forEach(item => {
        const word = String(item?.word || '').trim().toLowerCase();
        if (!word) return;
        aiRecommendedWords.add(word);
        aiWordReasons.set(word, String(item.reason || ''));
      });
      (lessonAiRecommendation?.patterns || []).forEach(item => {
        const key = Number(item?.sentence_key);
        if (!Number.isFinite(key)) return;
        aiRecommendedSentences.add(key);
        aiPatternByKey.set(key, {phrase: String(item.phrase || ''), reason: String(item.reason || '')});
      });
      renderAiRecPanel();
    }

    function renderAiRecPanel() {
      const host = document.getElementById('ai-rec-body');
      if (!host) return;
      if (!lessonAiRecommendation) {
        host.innerHTML = `<p class="ai-rec-note">还没有这节课的推荐，AI 会通读全文后挑出重点词汇和值得套用的句式。</p>
          <button class="ai-rec-btn" id="ai-rec-generate-btn" type="button" onclick="generateLessonAiRecommendation(false)">✨ 生成 AI 推荐</button>`;
        return;
      }
      const words = (lessonAiRecommendation.words || []).map(item =>
        `<span class="ai-rec-word" title="${escapeHtml(item.reason || '')}">${escapeHtml(item.word)}</span>`).join('');
      const patterns = (lessonAiRecommendation.patterns || []).map(item =>
        `<button class="ai-rec-pattern" type="button" onclick="jumpToAiPattern(${Number(item.sentence_key)})">
          <strong>${escapeHtml(item.phrase)}</strong>${item.reason ? `<span>${escapeHtml(item.reason)}</span>` : ''}
        </button>`).join('');
      host.innerHTML = `
        ${words ? `<div class="ai-rec-words">${words}</div>` : ''}
        ${patterns ? `<div class="ai-rec-patterns">${patterns}</div>` : ''}
        <button class="ai-rec-btn subtle" id="ai-rec-generate-btn" type="button" onclick="generateLessonAiRecommendation(true)">↻ 重新生成</button>`;
    }

    async function generateLessonAiRecommendation(regenerate) {
      const btn = document.getElementById('ai-rec-generate-btn');
      if (btn) { btn.disabled = true; btn.textContent = 'AI 正在读这节课…'; }
      try {
        const url = `/api/v2/lessons/${LESSON_ID}/ai-recommendations/refresh`;
        const options = {method: 'POST', body: JSON.stringify({regenerate: Boolean(regenerate)})};
        const resp = window.eltCredits?.billableFetch
          ? await eltCredits.billableFetch('recommendation_refresh', url, options)
          : await fetch(url, {...options, headers: {'Content-Type': 'application/json', 'Idempotency-Key': (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random())}});
        const data = await resp.json().catch(() => ({}));
        if (!resp.ok) {
          const detail = typeof data.detail === 'string' ? data.detail : '';
          throw new Error(data.error || detail || `生成失败（${resp.status}）`);
        }
        applyLessonAiRecommendation(data.recommendation || null);
        activeMode = 'ai-recommended';
        renderAll();
      } catch (error) {
        window.alert(error.message || '生成失败，请稍后重试');
        renderAiRecPanel();
      }
    }

    function jumpToAiPattern(key) {
      key = Number(key);
      if (!sentenceByKey(key)) return;
      activeMode = 'ai-recommended';
      searchQuery = '';
      selectedTags.clear();
      openSentenceKeys.add(key);
      document.getElementById('sentence-search').value = '';
      renderAll();
      requestAnimationFrame(() => {
        const card = document.querySelector(`.sentence-card[data-key="${key}"]`);
        card?.scrollIntoView({behavior: 'smooth', block: 'center'});
        card?.focus({preventScroll: true});
      });
    }

    async function loadIntensiveStudy() {
      await syncIntensiveHighlightedWords();
      const [documentResponse, tagResponse, knownResponse, vocabResponse, recommendationResponse, savedSentencesResponse] = await Promise.all([
        fetch(`/api/v2/lessons/${LESSON_ID}/intensive${_wordlistsQuery()}`),
        fetch('/api/v2/lessons/sentence-tags'),
        fetch('/api/known-words'),
        fetch('/vocab-log'),
        fetch(`/api/v2/lessons/${LESSON_ID}/ai-recommendations`, {cache: 'no-store'}),
        fetch('/api/v2/lessons/sentence-review'),
      ]);
      if (!documentResponse.ok) throw new Error('无法加载整篇精读数据');
      if (savedSentencesResponse.ok) {
        const savedData = await savedSentencesResponse.json().catch(() => ({}));
        savedSentenceMap.clear();
        for (const item of savedData.sentences || []) {
          if (!item.archived) savedSentenceMap.set(normSentenceKey(item.text), item.id);
        }
      }
      intensiveDocument = await documentResponse.json();
      savedLessonWords.clear();
      for (const word of intensiveDocument.lesson_words || []) savedLessonWords.add(String(word).toLowerCase());
      for (const sentence of intensiveDocument.sentences || []) {
        if (sentence.oral_analysis && Object.keys(sentence.oral_analysis).length) {
          oralAnalysisCache.set(Number(sentence.key), sentence.oral_analysis);
        }
        if (Array.isArray(sentence.aligned_words) && sentence.aligned_words.length) {
          const words = sentence.aligned_words.map((word, index, items) => ({
            ...word,
            pause_after_ms: index < items.length - 1
              ? Math.max(0, Math.round((Number(items[index + 1].start) - Number(word.end)) * 1000))
              : Number(sentence.pause_after_ms || 0),
          }));
          pronunciationCache.set(Number(sentence.key), {
            source: 'mfa',
            aligned_words: words,
          });
        }
      }
      initIntensiveYouTube();
      if (tagResponse.ok) tagCatalog = await tagResponse.json();
      if (knownResponse.ok) {
        for (const word of await knownResponse.json()) knownWords.add(String(word).toLowerCase());
      }
      for (let index = 0; index < localStorage.length; index += 1) {
        const key = localStorage.key(index);
        if (key?.startsWith('known_') && localStorage.getItem(key) === '1') knownWords.add(key.slice(6));
      }
      if (vocabResponse.ok) {
        Object.assign(vocabLog, await vocabResponse.json());
        for (const word of Object.keys(vocabLog)) reviewBookWords.add(String(word).toLowerCase());
      }
      if (recommendationResponse.ok) {
        const recommendations = await recommendationResponse.json();
        applyLessonAiRecommendation(recommendations.recommendation || null);
      }
      document.getElementById('lesson-title').textContent = intensiveDocument.lesson?.title || '逐句精读';
      renderAll();
      focusTargetSentence();
    }

    document.addEventListener('click', event => {
      const closeWordCard = event.target.closest('[data-close-word-card]');
      if (closeWordCard) { closeIntensiveWordCard(); return; }
      const closeWordAnalysis = event.target.closest('[data-close-word-analysis]');
      if (closeWordAnalysis) {
        document.querySelector(`[data-word-result="${closeWordAnalysis.dataset.closeWordAnalysis}"]`)?.classList.remove('open');
        return;
      }
      const speakWord = event.target.closest('[data-speak-word]');
      if (speakWord) {
        playIntensiveWord(speakWord.dataset.speakWord);
        return;
      }
      const speakExample = event.target.closest('[data-speak-example]');
      if (speakExample) {
        speakIntensiveExample(speakExample.dataset.speakExample);
        return;
      }
      const saveExample = event.target.closest('[data-save-example]');
      if (saveExample) {
        saveIntensiveExample(saveExample, saveExample.dataset.saveExample);
        return;
      }
      const studyWord = event.target.closest('[data-study-word]');
      if (studyWord) { analyzeIntensiveWord(studyWord.dataset.studyWord, Number(studyWord.dataset.key)); return; }
      const addWordReview = event.target.closest('[data-add-word-review]');
      if (addWordReview) {
        addIntensiveWordToReview(
          addWordReview.dataset.addWordReview,
          addWordReview.dataset.reviewMeaning,
          addWordReview,
        );
        return;
      }
      const toggleWordSave = event.target.closest('[data-toggle-word-save]');
      if (toggleWordSave) {
        toggleIntensiveWordSaved(toggleWordSave.dataset.toggleWordSave, Number(toggleWordSave.dataset.key))
          .catch(error => window.alert(error.message));
        return;
      }
      const markKnown = event.target.closest('[data-mark-known]');
      if (markKnown) {
        markIntensiveWordKnown(markKnown.dataset.markKnown).catch(error => window.alert(error.message));
        return;
      }
      const mode = event.target.closest('[data-filter]');
      if (mode) { stopIntensiveAutoPlay(); activeMode = mode.dataset.filter; renderAll(); return; }
      const viewMode = event.target.closest('[data-view-mode]');
      if (viewMode) { stopIntensiveAutoPlay(); setIntensiveViewMode(viewMode.dataset.viewMode); return; }
      const cardNav = event.target.closest('[data-card-nav]');
      if (cardNav) { navigateSentenceCard(Number(cardNav.dataset.cardNav)); return; }
      const tag = event.target.closest('[data-tag-filter]');
      if (tag) {
        stopIntensiveAutoPlay();
        const name = tag.dataset.tagFilter;
        if (selectedTags.has(name)) selectedTags.delete(name); else selectedTags.add(name);
        renderAll();
        return;
      }
      const groupToggle = event.target.closest('[data-toggle-group]');
      if (groupToggle) {
        const index = Number(groupToggle.dataset.toggleGroup);
        if (openGroupIndexes.has(index)) openGroupIndexes.delete(index); else openGroupIndexes.add(index);
        renderSentenceList();
        return;
      }
      const toggle = event.target.closest('[data-toggle-key]');
      if (toggle) {
        const key = Number(toggle.dataset.toggleKey);
        const shouldOpen = intensiveViewMode === 'card' || !openSentenceKeys.has(key);
        if (shouldOpen) openSentenceKeys.add(key); else openSentenceKeys.delete(key);
        renderSentenceList();
        if (shouldOpen && !pronunciationCache.has(key)) loadPronunciationGuide(key);
        return;
      }
      const toggleTagEditor = event.target.closest('[data-toggle-tag-editor]');
      if (toggleTagEditor) {
        const key = Number(toggleTagEditor.dataset.toggleTagEditor);
        if (openTagEditorKeys.has(key)) openTagEditorKeys.delete(key); else openTagEditorKeys.add(key);
        renderSentenceList();
        return;
      }
      const word = event.target.closest('[data-word]');
      if (word) { openIntensiveWordCard(word, word.dataset.word, Number(word.dataset.key)); return; }
      const play = event.target.closest('[data-play-sentence]');
      if (play) { stopIntensiveAutoPlay(); playIntensiveSentence(Number(play.dataset.playSentence)); return; }
      const speed = event.target.closest('[data-sentence-speed]');
      if (speed) { setSentencePlaybackSpeed(Number(speed.dataset.key), Number(speed.dataset.sentenceSpeed)); return; }
      const oral = event.target.closest('[data-generate-oral]');
      if (oral) { generateOralAnalysis(Number(oral.dataset.generateOral), oral.dataset.force === 'true'); return; }
      const hint = event.target.closest('[data-generate-hint]');
      if (hint) { generatePracticeHint(Number(hint.dataset.generateHint)); return; }
      const mic = event.target.closest('[data-practice-mic]');
      if (mic) { togglePracticeMic(Number(mic.dataset.practiceMic)); return; }
      const practice = event.target.closest('[data-submit-practice]');
      if (practice) { submitPractice(Number(practice.dataset.submitPractice)); return; }
      const practiceHistory = event.target.closest('[data-toggle-practice-history]');
      if (practiceHistory) { togglePracticeHistory(Number(practiceHistory.dataset.togglePracticeHistory)); return; }
      const save = event.target.closest('[data-toggle-save]');
      if (save) { toggleSentenceSaved(Number(save.dataset.toggleSave)); return; }
      const saveTags = event.target.closest('[data-save-tags]');
      if (saveTags) { saveSentenceTags(Number(saveTags.dataset.saveTags)); return; }
      if (!event.target.closest('#intensive-word-card')) closeIntensiveWordCard();
    });

    document.addEventListener('change', event => {
      const category = event.target.closest('[data-tag-category]');
      if (category) {
        updateTagNameOptions(Number(category.dataset.tagCategory), category.value);
        return;
      }
      const tagName = event.target.closest('[data-tag-name]');
      if (tagName) updateCustomTagVisibility(Number(tagName.dataset.tagName));
    });

    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') {
        closeIntensiveWordCard();
        return;
      }
      if (
        intensiveViewMode === 'card'
        && !event.target.closest('input, textarea, select, [contenteditable="true"]')
        && ['ArrowLeft', 'ArrowRight'].includes(event.key)
      ) {
        event.preventDefault();
        navigateSentenceCard(event.key === 'ArrowLeft' ? -1 : 1);
      }
    });
    window.addEventListener('resize', closeIntensiveWordCard);

    document.getElementById('sentence-search').addEventListener('input', event => {
      stopIntensiveAutoPlay();
      searchQuery = event.target.value;
      renderSentenceList();
    });
    document.getElementById('intensive-autoplay-btn').addEventListener('click', toggleIntensiveAutoPlay);
    document.getElementById('intensive-autoplay-loop').addEventListener('click', toggleIntensiveAutoLoop);
    document.getElementById('expand-visible').addEventListener('click', () => {
      const visible = visibleSentences();
      const shouldOpen = visible.some(sentence => !openSentenceKeys.has(Number(sentence.key)));
      for (const sentence of visible) {
        if (shouldOpen) openSentenceKeys.add(Number(sentence.key));
        else openSentenceKeys.delete(Number(sentence.key));
      }
      renderSentenceList();
    });

    loadIntensiveStudy().catch(error => {
      document.getElementById('intensive-sentence-list').innerHTML = `<div class="empty-state">${escapeHtml(error.message)}</div>`;
    });
  </script>
</body>
</html>
