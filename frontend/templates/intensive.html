<!doctype html>
<html lang="zh-CN">
<head>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎧</text></svg>">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>逐句精读 - EchoLingo</title>
  <style>
    :root {
      --paper: #f4f1e8;
      --surface: #fffdf7;
      --surface-soft: #edf3ed;
      --ink: #243129;
      --muted: #68736c;
      --line: #d8ddd5;
      --brand: #356149;
      --brand-dark: #234735;
      --accent: #b9893d;
      --danger: #a8483f;
      --shadow: 0 16px 38px rgba(36, 49, 41, .10);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 10%, rgba(185, 137, 61, .08), transparent 28%),
        linear-gradient(180deg, #f7f5ee 0, var(--paper) 100%);
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    button, input, select { font: inherit; }
    button, .button-link {
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--ink);
      cursor: pointer;
    }
    button:hover, .button-link:hover { border-color: var(--brand); }
    button:focus-visible, input:focus-visible, select:focus-visible, .button-link:focus-visible {
      outline: 3px solid rgba(53, 97, 73, .18);
      outline-offset: 2px;
    }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 18px;
      padding: 14px clamp(18px, 4vw, 54px);
      border-bottom: 1px solid rgba(53, 97, 73, .18);
      background: rgba(255, 253, 247, .94);
      backdrop-filter: blur(14px);
    }
    .back-link, .button-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 12px;
      color: var(--brand-dark);
      text-decoration: none;
      font-weight: 700;
    }
    .title-block { min-width: 0; }
    .eyebrow {
      color: var(--accent);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    h1 {
      overflow: hidden;
      margin: 2px 0 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(22px, 3vw, 34px);
      line-height: 1.15;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .study-progress {
      min-width: 120px;
      color: var(--muted);
      font-size: 12px;
      text-align: right;
    }
    .layout {
      display: grid;
      grid-template-columns: minmax(220px, 280px) minmax(0, 860px);
      justify-content: center;
      gap: 24px;
      width: min(1220px, calc(100% - 32px));
      margin: 26px auto 64px;
    }
    .filter-panel {
      position: sticky;
      top: 92px;
      align-self: start;
      max-height: calc(100vh - 112px);
      overflow-y: auto;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255, 253, 247, .86);
      box-shadow: var(--shadow);
    }
    .filter-panel h2 {
      margin: 0 0 5px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 18px;
    }
    .filter-note { margin: 0 0 14px; color: var(--muted); font-size: 12px; line-height: 1.5; }
    .mode-filters { display: grid; gap: 7px; }
    .mode-filter {
      display: flex;
      justify-content: space-between;
      padding: 8px 10px;
      text-align: left;
    }
    .mode-filter.active { border-color: var(--brand); background: var(--surface-soft); color: var(--brand-dark); font-weight: 750; }
    .filter-section { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); }
    .filter-label { display: block; margin-bottom: 8px; color: var(--muted); font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
    .ai-rec-note { margin: 0 0 10px; color: var(--muted); font-size: 12px; line-height: 1.6; }
    .ai-rec-btn {
      width: 100%; padding: 8px 10px; border: 1px solid var(--brand); border-radius: 8px;
      background: var(--brand); color: #fff; font-size: 13px; font-weight: 650; cursor: pointer;
    }
    .ai-rec-btn:hover { filter: brightness(1.05); }
    .ai-rec-btn:disabled { opacity: .6; cursor: wait; }
    .ai-rec-btn.subtle { background: transparent; color: var(--brand-dark); margin-top: 10px; }
    .ai-rec-words { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 4px; }
    .ai-rec-word {
      padding: 3px 9px; border-radius: 999px; background: var(--surface-soft);
      border: 1px solid var(--line); color: var(--brand-dark); font-size: 12px; font-weight: 650;
    }
    .ai-rec-patterns { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
    .ai-rec-pattern {
      text-align: left; border: 1px solid var(--line); border-radius: 8px; background: var(--surface);
      padding: 7px 10px; cursor: pointer; font-size: 12px; line-height: 1.5;
    }
    .ai-rec-pattern:hover { border-color: var(--brand); }
    .ai-rec-pattern strong { color: var(--brand-dark); display: block; }
    .ai-rec-pattern span { color: var(--muted); }
    #tag-filter-list { display: flex; flex-wrap: wrap; gap: 7px; }
    .tag-filter {
      min-height: 30px;
      padding: 5px 9px;
      border-radius: 999px;
      font-size: 12px;
    }
    .tag-filter.active { border-color: var(--accent); background: #fbf2df; color: #72511f; }
    #sentence-search {
      width: 100%;
      min-height: 38px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--ink);
    }
    .sentence-column { min-width: 0; }
    .column-intro {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 18px;
      margin: 0 0 14px;
      padding: 0 3px;
    }
    .column-intro h2 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: 24px; }
    .column-intro p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
    .column-actions { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 8px; }
    .view-switch {
      display: inline-flex;
      padding: 3px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(255, 253, 247, .72);
    }
    .view-switch button { min-height: 30px; padding: 4px 10px; border: 0; background: transparent; font-size: 12px; }
    .view-switch button.active { background: var(--brand); color: white; box-shadow: 0 3px 8px rgba(35, 71, 53, .18); }
    .card-navigator {
      display: grid;
      grid-template-columns: 42px minmax(90px, auto) 42px;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin: 0 0 12px;
    }
    .card-navigator[hidden] { display: none; }
    .card-nav-button { min-height: 40px; border-color: #b7c8bb; color: var(--brand-dark); font-size: 20px; }
    .card-nav-position { color: var(--muted); font-family: Georgia, "Times New Roman", serif; font-size: 14px; text-align: center; }
    .sentence-list { display: grid; gap: 12px; }
    .sentence-list.card-mode .sentence-card { min-height: min(720px, calc(100vh - 180px)); }
    .sentence-card {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
      box-shadow: 0 5px 18px rgba(36, 49, 41, .06);
      transition: border-color .18s ease, box-shadow .18s ease, transform .18s ease;
    }
    .sentence-card:hover { border-color: #becbbf; transform: translateY(-1px); }
    .sentence-card.open { border-color: #97b19f; box-shadow: 0 12px 28px rgba(35, 71, 53, .11); }
    .sentence-card.targeted {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(218, 164, 61, .2), 0 12px 28px rgba(35, 71, 53, .11);
      animation: target-sentence-arrival .55s ease-out;
    }
    @keyframes target-sentence-arrival {
      from { transform: translateY(10px); opacity: .72; }
      to { transform: translateY(0); opacity: 1; }
    }
    .sentence-card-header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      padding-right: 14px;
    }
    .sentence-head {
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr) auto;
      gap: 12px;
      width: 100%;
      min-height: 0;
      padding: 15px 16px;
      border: 0;
      border-radius: 0;
      background: transparent;
      text-align: left;
    }
    .sentence-quick-actions { display: flex; align-items: center; gap: 7px; }
    .sentence-quick-actions button { min-height: 32px; padding: 5px 9px; font-size: 12px; white-space: nowrap; }
    .sentence-header-play { border-color: var(--brand); background: var(--brand); color: white; font-weight: 750; }
    .sentence-header-speed {
      min-height: 32px;
      padding: 4px 24px 4px 7px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--ink);
      font-size: 12px;
    }
    .sentence-save-button.saved { border-color: var(--brand); background: #e7f1e9; color: var(--brand-dark); font-weight: 800; }
    .sentence-tag-editor {
      display: none;
      margin: 0 18px 12px 70px;
      padding: 10px 12px 12px;
      border: 1px solid #d7ddd5;
      border-radius: 9px;
      background: #f7f8f3;
    }
    .sentence-tag-editor.open { display: block; }
    .sentence-number {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--surface-soft);
      color: var(--brand-dark);
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 700;
    }
    .sentence-card.saved .sentence-number { background: var(--brand); color: white; }
    .autoplay-btn.active { background: var(--brand); color: #fff; border-color: var(--brand); }
    .autoplay-loop.active { background: #eaf4ec; color: #35684e; border-color: #35684e; }
    .sentence-card.auto-playing { outline: 2px solid var(--brand); box-shadow: 0 0 0 4px rgba(35,71,53,.14); }
    .sentence-copy { font-family: Georgia, "Times New Roman", serif; font-size: 17px; line-height: 1.65; }
    .sentence-copy mark {
      padding: 1px 3px;
      border-radius: 4px;
      background: #f7df8d;
      color: #6d5215;
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
    }
    .sentence-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
    .sentence-zh {
      display: block;
      margin-top: 4px;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      font-size: 13.5px;
      line-height: 1.6;
      color: var(--muted);
    }
    .block-group { margin-bottom: 10px; }
    .block-group-head {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 8px 14px;
      border: 1px solid #dbe4dc;
      border-radius: 10px;
      background: #f2f6f1;
      color: #40513f;
      font: 600 13px/1.4 "Segoe UI", "Microsoft YaHei", sans-serif;
      cursor: pointer;
      text-align: left;
    }
    .block-group-head:hover { border-color: var(--brand); }
    .block-group-head .block-group-toggle { margin-left: auto; color: var(--muted); font-size: 15px; }
    .block-group-body { display: grid; gap: 10px; padding-top: 10px; }
    .alignment-badge {
      display: inline-flex;
      align-items: center;
      border: 1px solid #9fc8b1;
      border-radius: 999px;
      padding: 2px 7px;
      color: #245c42;
      background: #edf8f1;
      font: 700 11px/1.3 Arial, sans-serif;
    }
    .alignment-badge--warn { border-color: #e3b23c; color: #8a6414; background: #fdf6e3; }
    .tag-chip, .saved-chip {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 3px 8px;
      border-radius: 999px;
      background: #eef2ed;
      color: #4b5b50;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      font-size: 11px;
    }
    .saved-chip { background: #e4f0e8; color: var(--brand-dark); font-weight: 700; }
    .planning-chip { border: 1px solid #b9cec0; background: #eef6f0; color: var(--brand-dark); font-weight: 750; }
    .expand-mark { padding-top: 6px; color: var(--muted); font-size: 18px; }
    .sentence-detail { display: none; padding: 0 18px 18px 70px; }
    .sentence-card.open .sentence-detail { display: block; animation: reveal .18s ease-out; }
    @keyframes reveal { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
    .v1-study-stack { display: grid; gap: 12px; }
    .sentence-text-stack { display: grid; }
    .sentence-text-stack .inline-sentence { border-radius: 0 9px 0 0; }
    .sentence-text-stack .inline-sentence:last-child { border-radius: 0 9px 9px 0; }
    .inline-sentence {
      padding: 13px 15px;
      border-left: 3px solid var(--accent);
      border-radius: 0 9px 9px 0;
      background: #faf7ef;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 17px;
      line-height: 2;
    }
    .inline-translation {
      padding: 10px 15px 12px;
      border-top: 1px dashed #d9ddd5;
      border-left: 3px solid var(--accent);
      border-radius: 0 0 9px 0;
      background: #f3f6f2;
      color: #66736b;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      font-size: 14px;
      line-height: 1.7;
    }
    .v1-module {
      overflow: hidden;
      border: 1px solid #d7ddd5;
      border-radius: 10px;
      background: rgba(255, 255, 255, .78);
    }
    .v1-module-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      border-bottom: 1px solid #e2e6df;
      background: #f4f6f1;
    }
    .v1-module-head h3 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: 16px; }
    .v1-module-kicker { color: var(--muted); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
    .v1-module-body { padding: 12px; }
    .pronunciation-controls, .speed-controls, .module-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; }
    .sentence-play { border-color: var(--brand); background: var(--brand); color: white; }
    #intensive-youtube-host {
      position: fixed;
      left: -10000px;
      bottom: 0;
      width: 240px;
      height: 135px;
      overflow: hidden;
      pointer-events: none;
    }
    .speed-button { min-height: 30px; padding: 4px 8px; font-size: 11px; }
    .speed-button.active { border-color: var(--accent); background: #fff5dc; color: #72511f; font-weight: 800; }
    .pronunciation-output {
      margin-top: 10px;
      overflow: hidden;
      border: 1px solid #dde2dc;
      border-radius: 10px;
      background: #f3f3f1;
      color: #31483b;
    }
    .aligned-pronunciation {
      display: flex;
      flex-wrap: wrap;
      align-items: stretch;
      gap: 0;
      padding: 0 12px 10px;
      font-family: Georgia, "Times New Roman", serif;
    }
    .pron-pair {
      position: relative;
      z-index: 0;
      display: inline-grid;
      grid-template-rows: auto auto;
      justify-items: stretch;
      gap: 0;
      min-width: max-content;
      padding: 0 0 9px;
    }
    .pron-pair.linked-out::after {
      position: absolute;
      z-index: -1;
      bottom: 2px;
      left: 54%;
      width: calc(100% + 10px);
      height: 9px;
      border-bottom: 2px solid #2b6f8d;
      border-radius: 0 0 50% 50%;
      content: "";
    }
    .pron-word, .pron-ipa {
      min-height: 38px;
      padding: 7px 5px;
      text-align: center;
      line-height: 1.25;
    }
    .pron-word { background: #faf7ed; color: var(--ink); font-size: 18px; }
    .pron-ipa { background: #ededed; color: #456052; font-size: 17px; }
    .pron-pair.stressed .pron-word, .pron-pair.stressed .pron-ipa { color: #1d3829; font-weight: 850; }
    .pron-pair.weak .pron-word, .pron-pair.weak .pron-ipa { color: #8b958e; font-size: .88em; }
    .pron-pair.linked-in .pron-ipa, .pron-pair.linked-out .pron-ipa { color: #1f607d; }
    .pron-group-break { align-self: stretch; padding: 45px 7px 0; background: linear-gradient(#faf7ed 0 38px, #ededed 38px); color: var(--accent); font-weight: 800; }
    .pron-group-break.strong { color: #9a5d00; letter-spacing: -2px; }
    .pron-tone { margin-left: 2px; color: #8a5a13; font-weight: 800; }
    .pronunciation-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding: 9px 14px 11px;
      border-top: 1px solid rgba(53, 97, 73, .12);
      color: var(--muted);
      font-size: 11px;
    }
    .pronunciation-legend b { color: var(--ink); }
    .legend-link {
      display: inline-block;
      min-width: 30px;
      height: 10px;
      border-bottom: 2px solid #2b6f8d;
      border-radius: 0 0 50% 50%;
    }
    .word-line { padding: 12px 14px; border-radius: 9px; background: #f3f6f2; line-height: 2; }
    .word-token { min-height: 28px; padding: 2px 3px; border: 0; background: transparent; color: var(--ink); font-family: Georgia, "Times New Roman", serif; font-size: 16px; }
    .word-token:hover { color: var(--brand); text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 3px; }
    .word-token.focus { padding-inline: 5px; border-radius: 5px; background: #f7df8d; color: #654a12; font-weight: 750; }
    .focus-word-list { display: flex; flex-wrap: wrap; gap: 7px; }
    .focus-word-chip { display: inline-flex; align-items: center; gap: 7px; min-height: 31px; padding: 4px 9px; border-color: #d5c385; background: #fff9e8; color: #6d5215; font-family: Georgia, "Times New Roman", serif; }
    .familiarity-badge { padding: 2px 6px; border-radius: 999px; background: rgba(109, 82, 21, .1); font-family: "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 10px; font-weight: 750; }
    .planning-word-badge { padding: 2px 6px; border-radius: 999px; background: #e4f0e8; color: var(--brand-dark); font-family: "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 10px; font-weight: 750; }
    .word-card {
      position: fixed;
      z-index: 60;
      display: none;
      width: min(340px, calc(100vw - 24px));
      padding: 18px;
      border: 1px solid #c7cfc5;
      border-radius: 16px;
      background: rgba(255, 253, 247, .98);
      box-shadow: 0 24px 70px rgba(35, 71, 53, .24);
      backdrop-filter: blur(16px);
    }
    .word-card.open { display: block; animation: reveal .16s ease-out; }
    .word-card-head { display: flex; align-items: start; justify-content: space-between; gap: 12px; }
    .word-card-title { margin: 0; color: var(--brand-dark); font-family: Georgia, "Times New Roman", serif; font-size: 25px; }
    .word-card-phonetic { margin-top: 3px; color: var(--muted); font-family: Georgia, "Times New Roman", serif; }
    .word-card-close { min-width: 34px; min-height: 34px; padding: 0; border-radius: 50%; }
    .word-card-meaning { margin-top: 13px; padding: 11px 12px; border-left: 3px solid var(--accent); border-radius: 0 8px 8px 0; background: #faf7ef; line-height: 1.6; }
    .word-card-status { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 13px; color: var(--muted); font-size: 12px; }
    .word-card-actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
    .word-card-actions button { width: 100%; }
    .word-save-button.saved { border-color: var(--brand); background: #e7f1e9; color: var(--brand-dark); font-weight: 800; }
    .word-review-button.in-review { border-color: #9db5a3; background: #edf4ee; color: var(--brand-dark); font-weight: 800; opacity: 1; }
    .word-example-item { margin-bottom: 10px; }
    .word-example-actions { display: inline-flex; gap: 6px; margin-left: 8px; vertical-align: middle; }
    .word-example-actions button { min-height: 28px; padding: 3px 8px; font-size: 12px; }
    .word-analysis-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
    .word-analysis-head h4 { margin: 0; }
    .word-analysis-actions { display: flex; align-items: center; gap: 6px; }
    .word-analysis-actions button { min-width: 32px; min-height: 30px; padding: 4px 8px; }
    .oral-modules { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; margin-top: 10px; }
    .oral-module { padding: 10px 11px; border-radius: 8px; background: #f2f5f0; line-height: 1.6; }
    .oral-module-label { display: block; margin-bottom: 4px; color: var(--brand-dark); font-size: 11px; font-weight: 850; letter-spacing: .04em; }
    .oral-template { display: block; margin-top: 5px; padding: 6px 8px; border-radius: 6px; background: white; color: #6b4f18; }
    .practice-hint { display: none; margin-bottom: 10px; padding: 9px 11px; border-left: 3px solid var(--accent); border-radius: 0 8px 8px 0; background: #fff9e9; line-height: 1.6; }
    .practice-hint.open { display: block; }
    .practice-input-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: stretch; gap: 8px; margin-top: 9px; }
    .practice-input-row textarea { min-height: 78px; resize: vertical; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; font: inherit; line-height: 1.5; }
    .practice-mic { min-width: 46px; padding: 6px 10px; font-size: 18px; }
    .practice-mic.recording { border-color: var(--danger); background: #fbe8e5; animation: mic-pulse 1s ease-in-out infinite; }
    @keyframes mic-pulse { 50% { box-shadow: 0 0 0 5px rgba(168, 72, 63, .12); } }
    .mic-status { margin-top: 6px; color: var(--muted); font-size: 12px; }
    .mic-status.error { color: var(--danger); }
    .mic-status[hidden] { display: none; }
    .practice-result { display: none; margin-top: 10px; padding: 11px 12px; border-radius: 8px; background: #eef4ef; line-height: 1.65; }
    .practice-result.open { display: block; }
    .practice-result ul { margin: 5px 0 0; padding-left: 20px; }
    .practice-sentence-line { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 7px; }
    .practice-sentence-copy { min-width: 0; font-family: Georgia, "Times New Roman", serif; font-size: 16px; line-height: 1.8; }
    .practice-sentence-label { margin-right: 6px; color: var(--muted); font-family: "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 12px; font-weight: 750; }
    .practice-sentence-speak { flex: 0 0 auto; min-height: 30px; padding: 4px 9px; color: var(--brand-dark); font-size: 12px; white-space: nowrap; }
    .practice-history-panel { margin-top: 12px; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: #fbfcf9; }
    .practice-history-panel[hidden] { display: none; }
    .practice-history-note { margin: 0 0 10px; color: var(--muted); font-size: 12px; }
    .practice-history-list { display: grid; gap: 10px; }
    .practice-history-item { padding: 12px 14px; border: 1px solid #dce6df; border-radius: 9px; background: #fff; }
    .practice-history-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
    .practice-history-time { color: var(--muted); font-size: 11px; }
    .practice-history-verdict { padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; }
    .practice-history-verdict.accepted { background: #e8f4ec; color: var(--brand-dark); }
    .practice-history-verdict.needs_revision { background: #fff2df; color: #8a5900; }
    .practice-history-user { margin: 7px 0; padding: 9px 11px; border-left: 3px solid var(--brand); background: #f6faf7; }
    .practice-history-issue { margin-top: 8px; padding: 8px 10px; border-left: 3px solid var(--danger); background: #fff5f3; color: #7f2e27; }
    .practice-history-field { margin-top: 7px; color: var(--ink); }
    .practice-history-field strong { display: block; margin-bottom: 2px; color: var(--muted); font-size: 11px; }
    .collection-module { border-style: dashed; }
    .study-actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
    .study-actions button { padding: 7px 11px; }
    .primary-action { border-color: var(--brand); background: var(--brand); color: white; }
    .tag-editor { display: grid; grid-template-columns: 130px minmax(180px, 1fr) auto; gap: 8px; margin-top: 12px; }
    .tag-editor select, .tag-editor input { width: 100%; min-height: 38px; padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px; background: white; color: var(--ink); }
    .tag-editor > button { align-self: end; }
    .tag-field { display: grid; align-content: start; gap: 5px; }
    .tag-field-label { color: var(--muted); font-size: 10px; font-weight: 800; letter-spacing: .08em; }
    .tag-name-control { display: grid; gap: 6px; }
    .result-panel { display: none; margin-top: 12px; padding: 14px; border: 1px solid #d5ddd5; border-radius: 9px; background: #f6f8f5; line-height: 1.7; }
    .result-panel.open { display: block; }
    .word-analysis h4 { margin: 0 0 8px; color: var(--brand-dark); font-family: Georgia, "Times New Roman", serif; font-size: 18px; }
    .word-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .word-block { padding: 8px 9px; border-radius: 7px; background: white; }
    .word-block.full { grid-column: 1 / -1; }
    .word-label { display: block; margin-bottom: 3px; color: var(--muted); font-size: 11px; font-weight: 800; text-transform: uppercase; }
    .empty-state { padding: 44px 20px; border: 1px dashed #bdc8bd; border-radius: 12px; color: var(--muted); text-align: center; }
    @media (max-width: 820px) {
      .topbar { grid-template-columns: auto minmax(0, 1fr); }
      .study-progress { display: none; }
      .layout { grid-template-columns: 1fr; }
      .filter-panel { position: static; max-height: none; }
      .mode-filters { grid-template-columns: repeat(2, 1fr); }
      .sentence-detail { padding-left: 16px; }
      .sentence-card-header { grid-template-columns: 1fr; padding-right: 0; }
      .sentence-quick-actions { padding: 0 14px 12px 62px; }
      .sentence-tag-editor { margin-left: 16px; }
    }
    @media (max-width: 560px) {
      .topbar { padding: 10px 12px; gap: 10px; }
      .back-link { padding: 7px 9px; font-size: 12px; }
      .layout { width: min(100% - 20px, 1220px); margin-top: 14px; }
      .mode-filters { grid-template-columns: 1fr; }
      .column-intro { align-items: start; flex-direction: column; }
      .column-actions { width: 100%; justify-content: flex-start; }
      .sentence-head { grid-template-columns: 36px minmax(0, 1fr); padding: 13px 12px; }
      .sentence-quick-actions { padding-left: 12px; }
      .expand-mark { display: none; }
      .sentence-copy { font-size: 16px; }
      .tag-editor { grid-template-columns: 1fr; }
      .word-grid { grid-template-columns: 1fr; }
      .oral-modules { grid-template-columns: 1fr; }
      .practice-input-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="back-link" href="/workspace/{{ lesson_id }}">← 返回课程</a>
    <div class="title-block">
      <div class="eyebrow">Phase B · 逐句精学</div>
      <h1 id="lesson-title">逐句精读</h1>
    </div>
    <div id="study-progress" class="study-progress">正在载入文档…</div>
  </header>

  <main id="intensive-app" class="layout" data-lesson-id="{{ lesson_id }}">
    <aside class="filter-panel" aria-label="精读筛选">
      <h2>学习视图</h2>
      <p class="filter-note">整篇逐句浏览；收藏与标签继续写回当前 v2 课程。</p>
      <div class="mode-filters">
        <button class="mode-filter active" type="button" data-filter="all">全部 <span id="count-all">0</span></button>
        <button class="mode-filter" type="button" data-filter="vocabulary">重点词汇 <span id="count-vocabulary">0</span></button>
        <button class="mode-filter" type="button" data-filter="saved">已收藏 <span id="count-saved">0</span></button>
        <button class="mode-filter" type="button" data-filter="ai-recommended">AI 推荐 <span id="count-ai-recommended">0</span></button>
        <button class="mode-filter" type="button" data-filter="untagged">未标记 <span id="count-untagged">0</span></button>
      </div>
      <div class="filter-section" id="ai-rec-section">
        <span class="filter-label">本课 AI 推荐</span>
        <div id="ai-rec-body"></div>
      </div>
      <div class="filter-section">
        <label class="filter-label" for="sentence-search">搜索句子</label>
        <input id="sentence-search" type="search" placeholder="输入英文关键词">
      </div>
      <div class="filter-section">
        <span class="filter-label">按标签筛选（任一匹配）</span>
        <div id="tag-filter-list"></div>
      </div>
    </aside>

    <section class="sentence-column" aria-label="逐句精学">
      <div class="column-intro">
        <div>
          <h2>句子精学工坊</h2>
          <p>展开句子进入 v1 精学结构：音标、重点词汇、口语表达与情景造句。</p>
        </div>
        <div class="column-actions">
          <div class="view-switch" aria-label="句子视图">
            <button class="active" type="button" data-view-mode="list">列表</button>
            <button type="button" data-view-mode="card">卡片</button>
          </div>
          <button id="expand-visible" type="button">展开当前结果</button>
          <button id="intensive-autoplay-btn" class="autoplay-btn" type="button">▶ 自动播放</button>
          <button id="intensive-autoplay-loop" class="autoplay-loop" type="button" title="播完后自动从头循环" aria-pressed="false">🔁 循环</button>
          <select id="intensive-autoplay-rate" aria-label="自动播放倍速" onchange="setIntensiveAutoplayRate(Number(this.value))">
            <option value="0.6">0.6×</option>
            <option value="0.8">0.8×</option>
            <option value="1" selected>1×</option>
            <option value="1.25">1.25×</option>
            <option value="1.5">1.5×</option>
          </select>
        </div>
      </div>
      <nav id="card-navigator" class="card-navigator" aria-label="卡片句子导航" hidden>
        <button class="card-nav-button" type="button" data-card-nav="-1" aria-label="上一句">←</button>
        <span id="card-nav-position" class="card-nav-position">1 / 1</span>
        <button class="card-nav-button" type="button" data-card-nav="1" aria-label="下一句">→</button>
      </nav>
      <div id="intensive-sentence-list" class="sentence-list">
        <div class="empty-state">正在加载精读内容…</div>
      </div>
    </section>
  </main>

  <audio id="intensive-audio" preload="metadata" hidden></audio>
  <div id="intensive-youtube-host" aria-hidden="true"></div>
  <aside id="intensive-word-card" class="word-card" role="dialog" aria-label="重点词汇卡片" aria-live="polite" tabindex="-1"></aside>

  <script src="/static/elt_credits.js?v=20260809-1"></script>
<script>document.addEventListener("DOMContentLoaded",function(){if(window.eltCredits){eltCredits.annotate();}});</script>
<script src="/static/natural-tts.js?v=20260809-1"></script>
  <script>
    const LESSON_ID = {{ lesson_id }};
    const targetSentenceParam = new URLSearchParams(window.location.search).get('sentence_key');
    const targetSentenceKey = targetSentenceParam === null ? null : Number(targetSentenceParam);
    let intensiveDocument = {lesson: {}, sentences: []};
    let tagCatalog = {categories: [], tags: []};
    let activeMode = 'all';
    let searchQuery = '';
    const selectedTags = new Set();
    const openSentenceKeys = new Set();
    const openGroupIndexes = new Set([0]);  // 分段折叠：默认只展开第一段
    const openTagEditorKeys = new Set();
    const pronunciationCache = new Map();
    const oralAnalysisCache = new Map();
    const practiceHintCache = new Map();
    const practiceHintHistory = new Map();
    const sentenceSpeed = new Map();
    const knownWords = new Set();
    const savedLessonWords = new Set();
    // 已收藏句子：规范化文本 -> sentence_id（用于例句收藏按钮双向开关）
    const savedSentenceMap = new Map();
    function normSentenceKey(text) {
      return String(text || '').trim().toLowerCase().replace(/\s+/g, ' ');
    }
    const reviewBookWords = new Set();
    const aiRecommendedWords = new Set();
    const aiRecommendedSentences = new Set();
    let lessonAiRecommendation = null;
    const aiWordReasons = new Map();
    const aiPatternByKey = new Map();
    const vocabLog = {};
    const wordAnalysisCache = new Map();
    let activeWordCard = null;
    let activePracticeRecorder = null;
    let activePracticeMicKey = null;
    let activeSpeechTimer = null;
    let activeWordSpeechTimer = null;
    let activeWordUtterance = null;
    let intensiveViewMode = 'list';
    let cardSentenceKey = Number.isFinite(targetSentenceKey) ? targetSentenceKey : null;
    let intensiveYouTubePlayer = null;
    let intensiveYouTubeReady = false;
    let intensiveYouTubeApiLoading = false;
    let pendingYouTubeRange = null;
    const CUSTOM_TAG_VALUE = '__custom__';
    const FOCUS_WORD_STOPWORDS = new Set([
      'a', 'an', 'the', 'and', 'or', 'but', 'if', 'then', 'than', 'to', 'of', 'in', 'on', 'at', 'for',
      'from', 'with', 'by', 'as', 'is', 'am', 'are', 'was', 'were', 'be', 'been', 'being', 'do', 'does',
      'did', 'have', 'has', 'had', 'i', 'you', 'he', 'she', 'it', 'we', 'they', 'this', 'that', 'these',
      'those', 'my', 'your', 'his', 'her', 'our', 'their', 'not', 'so', 'can', 'could', 'will', 'would',
    ]);
    const PRON_WEAK_FORMS = new Set([
      'a', 'an', 'the', 'at', 'for', 'from', 'in', 'of', 'on', 'to', 'with', 'by', 'as', 'and', 'or',
      'but', 'that', 'than', 'he', 'him', 'his', 'her', 'it', 'its', 'them', 'us', 'we', 'you', 'they',
      'am', 'are', 'be', 'been', 'can', 'could', 'do', 'does', 'had', 'has', 'have', 'is', 'shall',
      'should', 'was', 'were', 'will', 'would',
    ]);
    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, char => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[char]);
    }

    function sentenceByKey(key) {
      return intensiveDocument.sentences.find(item => Number(item.key) === Number(key));
    }

    function sentenceTags(sentence) {
      return Array.isArray(sentence.tags) ? sentence.tags : [];
    }

    function sentenceFocusWords(sentence) {
      return (Array.isArray(sentence.highlighted_words) ? sentence.highlighted_words : [])
        .map(word => String(word).toLowerCase())
        .filter((word, index, words) => word && !knownWords.has(word) && words.indexOf(word) === index);
    }

    function sentencePlanningState(sentence) {
      const tokens = String(sentence.text || '').toLowerCase().match(/[a-z]+(?:'[a-z]+)?/g) || [];
      return {
        sentenceRecommended: aiRecommendedSentences.has(Number(sentence.key)),
        wordRecommended: tokens.some(word => aiRecommendedWords.has(word)),
      };
    }

    function visibleSentences() {
      const query = searchQuery.trim().toLowerCase();
      return intensiveDocument.sentences.filter(sentence => {
        if (activeMode === 'saved' && !sentence.saved) return false;
        const planning = sentencePlanningState(sentence);
        if (activeMode === 'ai-recommended' && !planning.sentenceRecommended && !planning.wordRecommended) return false;
        if (activeMode === 'untagged' && sentenceTags(sentence).length) return false;
        if (activeMode === 'vocabulary' && !sentenceFocusWords(sentence).length) return false;
        if (query && !sentence.text.toLowerCase().includes(query)) return false;
        if (selectedTags.size) {
          const names = new Set(sentenceTags(sentence).map(tag => tag.name));
          if (![...selectedTags].some(name => names.has(name))) return false;
        }
        return true;
      });
    }

    function renderWords(text, key) {
      const highlighted = new Set(sentenceFocusWords(sentenceByKey(key) || {}));
      const tokens = String(text || '').match(/[A-Za-z]+(?:'[A-Za-z]+)?|[^A-Za-z]+/g) || [];
      return tokens.map(token => {
        if (!/^[A-Za-z]/.test(token)) return escapeHtml(token);
        const normalized = token.toLowerCase();
        return `<button class="word-token${highlighted.has(normalized) ? ' focus' : ''}" type="button" data-word="${escapeHtml(normalized)}" data-key="${key}">${escapeHtml(token)}</button>`;
      }).join('');
    }

    function renderSentenceSummary(sentence) {
      const highlighted = new Set(sentenceFocusWords(sentence));
      const tokens = String(sentence.text || '').match(/[A-Za-z]+(?:'[A-Za-z]+)?|[^A-Za-z]+/g) || [];
      return tokens.map(token => {
        if (!/^[A-Za-z]/.test(token) || !highlighted.has(token.toLowerCase())) return escapeHtml(token);
        return `<mark>${escapeHtml(token)}</mark>`;
      }).join('');
    }

    function focusWords(text) {
      const words = String(text || '').match(/[A-Za-z]+(?:'[A-Za-z]+)?/g) || [];
      const unique = [];
      const seen = new Set();
      for (const word of words) {
        const normalized = word.toLowerCase();
        if (FOCUS_WORD_STOPWORDS.has(normalized) || seen.has(normalized) || normalized.length < 3) continue;
        seen.add(normalized);
        unique.push(word);
        if (unique.length >= 12) break;
      }
      return unique.length ? unique : words.slice(0, 8);
    }

    function practiceWords(sentence) {
      const highlighted = sentenceFocusWords(sentence);
      return highlighted.length ? highlighted : focusWords(sentence.text);
    }

    function renderFocusWordChips(sentence) {
      return sentenceFocusWords(sentence).map(word => {
        const recommended = aiRecommendedWords.has(word);
        return `<button class="focus-word-chip" type="button" data-word="${escapeHtml(word)}" data-key="${sentence.key}"><strong>${escapeHtml(word)}</strong><span class="familiarity-badge">${vocabLog[word]?.count ? `已学 ${vocabLog[word].count} 次` : '新词'}</span>${recommended ? `<span class="planning-word-badge" title="${escapeHtml(aiWordReasons.get(word) || '')}">AI 推荐</span>` : ''}</button>`;
      }).join('') || '<span class="filter-note">这句话没有可提取的重点词。</span>';
    }

    function tagsForCategory(category) {
      return (tagCatalog.tags || [])
        .filter(tag => tag.category === category)
        .sort((a, b) => a.name.localeCompare(b.name, 'zh-CN'));
    }

    function renderTagNameOptions(category) {
      const options = tagsForCategory(category).map(tag => (
        `<option value="${escapeHtml(tag.name)}">${escapeHtml(tag.name)}</option>`
      ));
      options.push(`<option value="${CUSTOM_TAG_VALUE}">＋ 自定义标签…</option>`);
      return options.join('');
    }

    function updateTagNameOptions(key, category) {
      const select = document.querySelector(`[data-tag-name="${key}"]`);
      const custom = document.querySelector(`[data-tag-custom="${key}"]`);
      if (!select || !custom) return;
      select.innerHTML = renderTagNameOptions(category);
      custom.hidden = true;
      custom.value = '';
    }

    function updateCustomTagVisibility(key) {
      const select = document.querySelector(`[data-tag-name="${key}"]`);
      const custom = document.querySelector(`[data-tag-custom="${key}"]`);
      if (!select || !custom) return;
      custom.hidden = select.value !== CUSTOM_TAG_VALUE;
      if (!custom.hidden) custom.focus();
    }

    function renderSentenceCard(sentence, documentIndex) {
      const tags = sentenceTags(sentence);
      const tagHtml = tags.map(tag => `<span class="tag-chip">${escapeHtml(tag.name)}</span>`).join('');
      const planning = sentencePlanningState(sentence);
      const aiPattern = aiPatternByKey.get(Number(sentence.key));
      const planningHtml = [
        planning.sentenceRecommended ? `<span class="tag-chip planning-chip" title="${escapeHtml(aiPattern ? `${aiPattern.phrase}${aiPattern.reason ? `：${aiPattern.reason}` : ''}` : '')}">AI 推荐句式</span>` : planning.wordRecommended ? '<span class="tag-chip planning-chip">含推荐词汇</span>' : '',
      ].join('');
      const coverage = Number(sentence.alignment_coverage || 0);
      // 对齐徽章只在覆盖率异常（<100%）时提示，正常情况不占用视觉
      const alignmentHtml = sentence.timing_source === 'mfa' && coverage < 0.999
        ? `<span class="alignment-badge alignment-badge--warn" title="逐词覆盖率 ${Math.round(coverage * 100)}%">对齐 ${Math.round(coverage * 100)}%</span>`
        : '';
      const open = openSentenceKeys.has(Number(sentence.key));
      const categories = tagCatalog.categories.map(category => (
        `<option value="${escapeHtml(category.id)}">${escapeHtml(category.label)}</option>`
      )).join('');
      const defaultCategory = tagCatalog.categories[0]?.id || '';
      const speed = sentenceSpeed.get(Number(sentence.key)) || 1;
      const pronunciation = pronunciationCache.get(Number(sentence.key));
      const oral = oralAnalysisCache.get(Number(sentence.key));
      const hint = practiceHintCache.get(Number(sentence.key));
      const targeted = Number(sentence.key) === targetSentenceKey;
      const tagEditorOpen = openTagEditorKeys.has(Number(sentence.key));
      return `<article class="sentence-card${sentence.saved ? ' saved' : ''}${open ? ' open' : ''}${targeted ? ' targeted' : ''}" data-key="${sentence.key}" tabindex="-1">
        <div class="sentence-card-header">
          <button class="sentence-head" type="button" data-toggle-key="${sentence.key}">
            <span class="sentence-number">${documentIndex + 1}</span>
            <span class="sentence-copy">${renderSentenceSummary(sentence)}
              ${sentence.translation ? `<span class="sentence-zh">${escapeHtml(sentence.translation)}</span>` : ''}
              <span class="sentence-meta">${planningHtml}${alignmentHtml}${tagHtml}</span>
            </span>
            <span class="expand-mark">${open ? '−' : '+'}</span>
          </button>
          <div class="sentence-quick-actions">
            <button class="sentence-header-play" type="button" data-play-sentence="${sentence.key}">${hasOriginalMedia() ? '▶ 原声整句' : '▶ 播放'}</button>
            <button class="sentence-save-button${sentence.saved ? ' saved' : ''}" type="button" data-toggle-save="${sentence.key}">${sentence.saved ? '★ 已收藏' : '☆ 收藏'}</button>
            <button type="button" data-toggle-tag-editor="${sentence.key}">🏷 标签</button>
          </div>
        </div>
        <div class="sentence-tag-editor${tagEditorOpen ? ' open' : ''}">
          <div class="tag-editor">
            <label class="tag-field"><span class="tag-field-label">分类</span><select data-tag-category="${sentence.key}">${categories}</select></label>
            <div class="tag-field">
              <span class="tag-field-label">细标签</span>
              <div class="tag-name-control">
                <select data-tag-name="${sentence.key}">${renderTagNameOptions(defaultCategory)}</select>
                <input data-tag-custom="${sentence.key}" type="text" placeholder="输入自定义标签" hidden>
              </div>
            </div>
            <button type="button" data-save-tags="${sentence.key}">添加标签</button>
          </div>
        </div>
        <div class="sentence-detail">
          <div class="v1-study-stack">
            <div class="sentence-text-stack">
              <div class="inline-sentence">${renderWords(sentence.text, sentence.key)}</div>
              ${sentence.translation ? `<div class="inline-translation">${escapeHtml(sentence.translation)}</div>` : ''}
            </div>

            <section class="v1-module" data-v1-module="pronunciation">
              <div class="v1-module-head"><h3>① 音标行</h3><span class="v1-module-kicker">发音</span></div>
              <div class="v1-module-body">
                <div class="pronunciation-controls">
                  <button class="sentence-play" type="button" data-play-sentence="${sentence.key}">${hasOriginalMedia() ? '▶ 播放原声' : '▶ 播放本句'}</button>
                  <div class="speed-controls" aria-label="播放速度">
                    ${[0.75, 1, 1.25, 2].map(value => `<button class="speed-button${speed === value ? ' active' : ''}" type="button" data-sentence-speed="${value}" data-key="${sentence.key}">${value}×</button>`).join('')}
                  </div>
                </div>
                <div class="pronunciation-output" data-pronunciation-output="${sentence.key}">${pronunciation ? renderPronunciationGuideData(pronunciation, sentence.text) : '正在载入基础规则音标…'}</div>
              </div>
            </section>

            <section class="v1-module" data-v1-module="vocabulary">
              <div class="v1-module-head"><h3>② 重点词汇</h3><span class="v1-module-kicker">词汇</span></div>
              <div class="v1-module-body">
                <div class="focus-word-list">${renderFocusWordChips(sentence)}</div>
                <div class="result-panel" data-word-result="${sentence.key}"></div>
              </div>
            </section>

            <section class="v1-module" data-v1-module="oral-expression">
              <div class="v1-module-head"><h3>③ 口语表达解析</h3><span class="v1-module-kicker">雅思复用</span></div>
              <div class="v1-module-body">
                <div class="module-actions"><button class="primary-action" type="button" data-generate-oral="${sentence.key}" data-force="${oral ? 'true' : 'false'}">${oral ? '重新解析' : 'AI 深度解析'}</button></div>
                <div data-oral-result="${sentence.key}">${oral ? renderOralAnalysis(oral, sentence.key) : '<div class="filter-note">识别句式、表达功能、雅思复用场景和迁移模板。</div>'}</div>
              </div>
            </section>

            <section class="v1-module" data-v1-module="practice">
              <div class="v1-module-head"><h3>④ 情景造句</h3><span class="v1-module-kicker">输出练习</span></div>
              <div class="v1-module-body">
                <div class="practice-hint${hint ? ' open' : ''}" data-practice-hint="${sentence.key}">${hint ? escapeHtml(hint) : ''}</div>
                <div class="module-actions"><button type="button" data-generate-hint="${sentence.key}">💡 ${hint ? '换一换' : '生成中文提示'}</button></div>
                <div class="practice-input-row">
                  <textarea data-practice-input="${sentence.key}" placeholder="参考中文提示，尝试用英文表达；留空可直接生成范例。"></textarea>
                  <button class="practice-mic" type="button" data-practice-mic="${sentence.key}" title="语音输入" aria-label="语音输入">🎤</button>
                  <button class="primary-action" type="button" data-submit-practice="${sentence.key}">批改 / 生成范例</button>
                </div>
                <div class="mic-status" data-mic-status="${sentence.key}" hidden></div>
                <div class="practice-result" data-practice-result="${sentence.key}"></div>
                <div class="module-actions"><button type="button" data-toggle-practice-history="${sentence.key}">📚 历史记录</button></div>
                <div class="practice-history-panel" data-practice-history="${sentence.key}" hidden></div>
              </div>
            </section>

          </div>
        </div>
      </article>`;
    }

    function renderTagFilters() {
      const filterTags = new Map();
      for (const sentence of intensiveDocument.sentences) {
        for (const tag of sentenceTags(sentence)) filterTags.set(tag.name, tag);
      }
      const root = document.getElementById('tag-filter-list');
      root.innerHTML = [...filterTags.values()].sort((a, b) => a.name.localeCompare(b.name, 'zh-CN')).map(tag => (
        `<button class="tag-filter${selectedTags.has(tag.name) ? ' active' : ''}" type="button" data-tag-filter="${escapeHtml(tag.name)}">${escapeHtml(tag.name)}</button>`
      )).join('') || '<span class="filter-note">打标签后可在这里筛选。</span>';
    }

    function formatClock(seconds) {
      const total = Math.max(0, Math.round(Number(seconds) || 0));
      const m = Math.floor(total / 60);
      const s = total % 60;
      return `${m}:${String(s).padStart(2, '0')}`;
    }

    // 长课文在列表模式下按 2 分钟时间窗分组折叠，避免几百句一次铺开；
    // 筛选/搜索结果保持平铺，方便扫读匹配项
    function renderGroupedSentenceCards(rendered) {
      const groups = [];
      for (const sentence of rendered) {
        const windowIndex = Math.floor((Number(sentence.start_seconds) || 0) / 120);
        const last = groups[groups.length - 1];
        if (last && last.windowIndex === windowIndex) last.items.push(sentence);
        else groups.push({windowIndex, items: [sentence]});
      }
      return groups.map((group, index) => {
        const groupOpen = openGroupIndexes.has(index) || group.items.some(sentence =>
          openSentenceKeys.has(Number(sentence.key)) || Number(sentence.key) === targetSentenceKey);
        const start = formatClock(group.items[0].start_seconds);
        const end = formatClock(group.items[group.items.length - 1].end_seconds);
        return `<section class="block-group" data-group-index="${index}">
          <button class="block-group-head" type="button" data-toggle-group="${index}" aria-expanded="${groupOpen}">
            <span>第 ${index + 1} 段 · ${start} – ${end} · ${group.items.length} 句</span>
            <span class="block-group-toggle">${groupOpen ? '−' : '+'}</span>
          </button>
          <div class="block-group-body"${groupOpen ? '' : ' hidden'}>${group.items.map(sentence => renderSentenceCard(sentence, intensiveDocument.sentences.indexOf(sentence))).join('')}</div>
        </section>`;
      }).join('');
    }

    function renderSentenceList() {
      const visible = visibleSentences();
      const root = document.getElementById('intensive-sentence-list');
      let rendered = visible;
      if (intensiveViewMode === 'card' && visible.length) {
        if (!visible.some(sentence => Number(sentence.key) === Number(cardSentenceKey))) {
          cardSentenceKey = Number(visible[0].key);
        }
        openSentenceKeys.add(Number(cardSentenceKey));
        rendered = visible.filter(sentence => Number(sentence.key) === Number(cardSentenceKey));
      }
      root.classList.toggle('card-mode', intensiveViewMode === 'card');
      const useGrouping = intensiveViewMode !== 'card'
        && rendered.length === intensiveDocument.sentences.length
        && rendered.length > 40;
      root.innerHTML = rendered.length
        ? (useGrouping
          ? renderGroupedSentenceCards(rendered)
          : rendered.map(sentence => renderSentenceCard(sentence, intensiveDocument.sentences.indexOf(sentence))).join(''))
        : '<div class="empty-state">当前筛选没有匹配句子。</div>';
      const cardPosition = Math.max(0, visible.findIndex(sentence => Number(sentence.key) === Number(cardSentenceKey)));
      const navigator = document.getElementById('card-navigator');
      navigator.hidden = intensiveViewMode !== 'card' || !visible.length;
      document.getElementById('card-nav-position').textContent = visible.length
        ? `${cardPosition + 1} / ${visible.length}`
        : '0 / 0';
      navigator.querySelector('[data-card-nav="-1"]').disabled = cardPosition <= 0;
      navigator.querySelector('[data-card-nav="1"]').disabled = cardPosition >= visible.length - 1;
      document.getElementById('expand-visible').hidden = intensiveViewMode === 'card';
      document.querySelectorAll('[data-view-mode]').forEach(button => {
        button.classList.toggle('active', button.dataset.viewMode === intensiveViewMode);
      });
      document.getElementById('count-all').textContent = intensiveDocument.sentences.length;
      document.getElementById('count-vocabulary').textContent = intensiveDocument.sentences.filter(item => sentenceFocusWords(item).length).length;
      document.getElementById('count-saved').textContent = intensiveDocument.sentences.filter(item => item.saved).length;
      document.getElementById('count-ai-recommended').textContent = intensiveDocument.sentences.filter(item => { const state = sentencePlanningState(item); return state.sentenceRecommended || state.wordRecommended; }).length;
      document.getElementById('count-untagged').textContent = intensiveDocument.sentences.filter(item => !sentenceTags(item).length).length;
      document.getElementById('study-progress').textContent = intensiveViewMode === 'card' && visible.length
        ? `卡片 ${cardPosition + 1} / ${visible.length}`
        : `显示 ${visible.length} / ${intensiveDocument.sentences.length} 句`;
    }

    function setIntensiveViewMode(mode) {
      if (!['list', 'card'].includes(mode)) return;
      intensiveViewMode = mode;
      if (mode === 'card') {
        const visible = visibleSentences();
        if (!visible.some(sentence => Number(sentence.key) === Number(cardSentenceKey))) {
          cardSentenceKey = visible.length ? Number(visible[0].key) : null;
        }
      }
      stopIntensivePlayback();
      renderSentenceList();
      if (mode === 'card' && Number.isFinite(cardSentenceKey) && !pronunciationCache.has(cardSentenceKey)) {
        loadPronunciationGuide(cardSentenceKey);
      }
    }

    function navigateSentenceCard(direction) {
      const visible = visibleSentences();
      if (!visible.length) return;
      let position = visible.findIndex(sentence => Number(sentence.key) === Number(cardSentenceKey));
      if (position < 0) position = 0;
      const next = visible[position + Number(direction)];
      if (!next) return;
      stopIntensivePlayback();
      cardSentenceKey = Number(next.key);
      openSentenceKeys.add(cardSentenceKey);
      closeIntensiveWordCard();
      renderSentenceList();
      document.querySelector(`.sentence-card[data-key="${cardSentenceKey}"]`)?.focus({preventScroll: true});
      if (!pronunciationCache.has(cardSentenceKey)) loadPronunciationGuide(cardSentenceKey);
    }

    function renderAll() {
      renderAiRecPanel();
      renderTagFilters();
      renderSentenceList();
      document.querySelectorAll('[data-filter]').forEach(button => button.classList.toggle('active', button.dataset.filter === activeMode));
    }

    function focusTargetSentence() {
      if (!Number.isFinite(targetSentenceKey) || !sentenceByKey(targetSentenceKey)) return;
      activeMode = 'all';
      searchQuery = '';
      selectedTags.clear();
      openSentenceKeys.add(targetSentenceKey);
      cardSentenceKey = targetSentenceKey;
      document.getElementById('sentence-search').value = '';
      renderAll();
      requestAnimationFrame(() => {
        const card = document.querySelector(`.sentence-card[data-key="${targetSentenceKey}"]`);
        card?.scrollIntoView({behavior: 'smooth', block: 'center'});
        card?.focus({preventScroll: true});
      });
      if (!pronunciationCache.has(targetSentenceKey)) loadPronunciationGuide(targetSentenceKey);
    }

    function pronunciationWordParts(token) {
      const match = String(token || '').match(/^([^A-Za-z0-9']*)([A-Za-z0-9']+)([^A-Za-z0-9']*)$/);
      return match
        ? {prefix: match[1], word: match[2], suffix: match[3]}
        : {prefix: '', word: String(token || ''), suffix: ''};
    }

    function isPronunciationMarker(token) {
      return ['/', '|', '↗', '↘', '→', '↗|', '↘|'].includes(token);
    }

    function renderPronunciationGuideData(data = {}, sentenceText = '') {
      const wordAnnotations = Array.isArray(data.word_annotations) ? data.word_annotations : [];
      const alignedWords = Array.isArray(data.aligned_words) ? data.aligned_words : [];
      const normalizedWord = value => String(value || '').toLowerCase().replace(/[^a-z0-9']/g, '');
      const alignedByAnnotation = new Map();
      let alignedCursor = 0;
      for (let annotationIndex = 0; annotationIndex < wordAnnotations.length; annotationIndex += 1) {
        const target = normalizedWord(wordAnnotations[annotationIndex]?.word);
        if (!target) continue;
        const searchEnd = Math.min(alignedWords.length, alignedCursor + 5);
        let matchedIndex = -1;
        for (let candidateIndex = alignedCursor; candidateIndex < searchEnd; candidateIndex += 1) {
          if (normalizedWord(alignedWords[candidateIndex]?.text || alignedWords[candidateIndex]?.word) === target) {
            matchedIndex = candidateIndex;
            break;
          }
        }
        if (matchedIndex < 0) continue;
        alignedByAnnotation.set(annotationIndex, alignedWords[matchedIndex]);
        alignedCursor = matchedIndex + 1;
      }
      const pauseMarker = (pauseMs, hasNext, fallbackBreak = false) => {
        if (!hasNext) return '';
        const measured = Number(pauseMs || 0);
        if (measured >= 220) {
          const strong = measured >= 650;
          const label = strong ? '原声明显停顿候选' : '原声短停顿候选';
          return `<span class="pron-group-break${strong ? ' strong' : ''}" aria-label="${label}" title="${label} · ${Math.round(measured)} 毫秒">${strong ? '//' : '/'}</span>`;
        }
        return fallbackBreak
          ? '<span class="pron-group-break" aria-label="AI 意群停顿候选" title="AI 意群停顿候选">/</span>'
          : '';
      };
      if (wordAnnotations.length) {
        const pairs = wordAnnotations.map((item, index) => {
          const previous = wordAnnotations[index - 1];
          const linkedIn = Boolean(previous?.link_to_next);
          const linkedOut = Boolean(item.link_to_next);
          const classes = [
            'pron-pair',
            String(item.ipa || '').includes('ˈ') ? 'stressed' : '',
            item.weak ? 'weak' : '',
            linkedIn ? 'linked-in' : '',
            linkedOut ? 'linked-out' : '',
          ].filter(Boolean).join(' ');
          return `<span class="${classes}">
            <span class="pron-word">${escapeHtml(item.word || '')}${escapeHtml(item.punctuation_after || '')}</span>
            <span class="pron-ipa">${escapeHtml(item.ipa || '—')}${item.tone ? `<span class="pron-tone">${escapeHtml(item.tone)}</span>` : ''}</span>
          </span>${pauseMarker(alignedByAnnotation.get(index)?.pause_after_ms, index < wordAnnotations.length - 1, item.break_after)}`;
        });
        const cachedLabel = data.cached ? ' · 已复用校对缓存' : '';
        return `<div class="aligned-pronunciation">${pairs.join('')}</div>
          <div class="pronunciation-legend">
            <span><b>重读</b>：粗体</span>
            <span><span class="legend-link"></span>：连读候选</span>
            <span style="color:#8b958e">弱读：浅灰</span>
            <span>/：原声短停顿 · //：原声明显停顿</span>
            <span>AI 逐词校对${cachedLabel}</span>
          </div>`;
      }
      if (alignedWords.length) {
        const vowelPhones = new Set(['AA', 'AE', 'AH', 'AO', 'AW', 'AY', 'EH', 'ER', 'EY', 'IH', 'IY', 'OW', 'OY', 'UH', 'UW']);
        const pairs = alignedWords.map((word, index) => {
          const phones = Array.isArray(word.phones) ? word.phones : [];
          const nextPhones = Array.isArray(alignedWords[index + 1]?.phones) ? alignedWords[index + 1].phones : [];
          const lastPhone = String(phones.at(-1)?.label || '').replace(/[012]$/, '').toUpperCase();
          const nextPhone = String(nextPhones[0]?.label || '').replace(/[012]$/, '').toUpperCase();
          const gap = Number(alignedWords[index + 1]?.start) - Number(word.end);
          const linkedOut = index < alignedWords.length - 1
            && Number.isFinite(gap) && gap <= 0.035
            && lastPhone && !vowelPhones.has(lastPhone) && vowelPhones.has(nextPhone);
          const previous = alignedWords[index - 1];
          const previousPhones = Array.isArray(previous?.phones) ? previous.phones : [];
          const previousLast = String(previousPhones.at(-1)?.label || '').replace(/[012]$/, '').toUpperCase();
          const gapBefore = Number(word.start) - Number(previous?.end);
          const linkedIn = index > 0
            && Number.isFinite(gapBefore) && gapBefore <= 0.035
            && previousLast && !vowelPhones.has(previousLast)
            && vowelPhones.has(String(phones[0]?.label || '').replace(/[012]$/, '').toUpperCase());
          const ipa = String(word.ipa || '');
          const normalized = String(word.text || word.word || '').toLowerCase();
          const classes = [
            'pron-pair',
            ipa.includes('ˈ') ? 'stressed' : '',
            PRON_WEAK_FORMS.has(normalized) && !ipa.includes('ˈ') ? 'weak' : '',
            linkedIn ? 'linked-in' : '',
            linkedOut ? 'linked-out' : '',
          ].filter(Boolean).join(' ');
          return `<span class="${classes}" title="${Number(word.start).toFixed(2)}–${Number(word.end).toFixed(2)} 秒">
            <span class="pron-word">${escapeHtml(word.text || word.word)}</span>
            <span class="pron-ipa">${escapeHtml(ipa || '—')}</span>
          </span>${pauseMarker(word.pause_after_ms, index < alignedWords.length - 1)}`;
        });
        return `<div class="aligned-pronunciation">${pairs.join('')}</div>`;
      }
      const natural = data.natural || data.phonetics_natural || data.canonical || '';
      if (!natural) return '<span class="filter-note">暂未生成音标。</span>';
      const wordTokens = String(sentenceText || '').split(/\s+/).filter(Boolean);
      const ipaEntries = [];
      for (const token of String(natural).split(/\s+/).filter(Boolean)) {
        if (token === '/' || token === '|') {
          if (ipaEntries.length) ipaEntries[ipaEntries.length - 1].breakAfter = true;
        } else if (['↗', '↘', '→', '↗|', '↘|'].includes(token)) {
          if (ipaEntries.length) ipaEntries[ipaEntries.length - 1].tone = token.replace('|', '');
        } else {
          const linkedParts = token.split('‿');
          linkedParts.forEach((part, partIndex) => {
            if (!part) return;
            ipaEntries.push({
              ipa: `${partIndex > 0 ? '‿' : ''}${part}`,
              breakAfter: false,
              tone: '',
            });
          });
        }
      }
      if (wordTokens.length !== ipaEntries.length) {
        return `<div class="aligned-pronunciation"><span class="pron-pair"><span class="pron-word">${escapeHtml(sentenceText)}</span><span class="pron-ipa">${escapeHtml(natural)}</span></span></div>
          <div class="pronunciation-legend"><span>音标分词暂未与原句完全对齐，已保留整句对照。</span></div>`;
      }
      const annotations = ipaEntries.map((entry, index) => {
        const linkedIn = entry.ipa.startsWith('‿');
        const core = entry.ipa.startsWith('‿') ? entry.ipa.slice(1) : entry.ipa;
        const word = pronunciationWordParts(wordTokens[index]).word.toLowerCase();
        return {
          linkedIn,
          linkedOut: false,
          stressed: core.includes('ˈ'),
          weak: PRON_WEAK_FORMS.has(word) && !core.includes('ˈ') && !/n't$/i.test(word),
          core,
        };
      });
      for (let index = 0; index < annotations.length - 1; index += 1) {
        annotations[index].linkedOut = annotations[index + 1].linkedIn;
      }
      const pairs = [];
      wordTokens.forEach((token, index) => {
        const entry = ipaEntries[index];
        const annotation = annotations[index];
        const parts = pronunciationWordParts(token);
        const classes = [
          'pron-pair',
          annotation.stressed ? 'stressed' : '',
          annotation.weak ? 'weak' : '',
          annotation.linkedIn ? 'linked-in' : '',
          annotation.linkedOut ? 'linked-out' : '',
        ].filter(Boolean).join(' ');
        if (index > 0 && ipaEntries[index - 1].breakAfter) {
          pairs.push('<span class="pron-group-break" aria-label="意群停顿">/</span>');
        }
        pairs.push(`<span class="${classes}">
          <span class="pron-word">${escapeHtml(parts.prefix)}${escapeHtml(parts.word)}${escapeHtml(parts.suffix)}</span>
          <span class="pron-ipa">${escapeHtml(annotation.core)}${entry.tone ? `<span class="pron-tone">${escapeHtml(entry.tone)}</span>` : ''}</span>
        </span>`);
      });
      const sourceLabel = {mfa: 'MFA 原声对齐', groq: '原声对齐（Groq）', whisper: '原声对齐（本地 Whisper）'}[data.source] || '规则音标';
      return `<div class="aligned-pronunciation">${pairs.join('')}</div>
        <div class="pronunciation-legend">
          <span><b>重读</b>：粗体</span>
          <span><span class="legend-link"></span>：连读</span>
          <span style="color:#8b958e">弱读：浅灰</span>
          <span>${escapeHtml(sourceLabel)}</span>
        </div>`;
    }

    async function loadPronunciationGuide(key) {
      const sentence = sentenceByKey(key);
      const result = document.querySelector(`[data-pronunciation-output="${key}"]`);
      if (!sentence || !result) return null;
      const existing = pronunciationCache.get(Number(key));
      const baseWords = Array.isArray(existing?.aligned_words) && existing.aligned_words.length
        ? existing.aligned_words
        : (Array.isArray(existing?.word_annotations) ? existing.word_annotations : []);
      result.textContent = '正在生成基础规则音标…';
      try {
        const response = await fetch('/api/phonetics', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            sentences: [sentence.text],
            mode: 'rule',
            base: true,
            structured: false,
            base_words: [baseWords.map(item => ({
              word: item.text || item.word || '',
              ipa: item.ipa || '',
            }))],
          }),
        });
        const data = await response.json();
        if (!response.ok || data.error) throw new Error(data.error || '音标生成失败');
        const pronunciation = data.results?.[0] || {};
        if (Array.isArray(existing?.aligned_words) && existing.aligned_words.length) {
          pronunciation.aligned_words = existing.aligned_words;
        }
        pronunciationCache.set(Number(key), pronunciation);
        result.innerHTML = renderPronunciationGuideData(pronunciation, sentence.text);
        return pronunciation;
      } catch (error) {
        if (existing) {
          result.innerHTML = `${renderPronunciationGuideData(existing, sentence.text)}<div class="filter-note">规则音标载入失败：${escapeHtml(error.message)}；已保留原声对齐结果。</div>`;
          return existing;
        }
        result.textContent = `基础音标生成失败：${error.message}`;
        return null;
      }
    }

    function stopIntensivePlayback() {
      if (activeSpeechTimer) {
        clearTimeout(activeSpeechTimer);
        clearInterval(activeSpeechTimer);
      }
      if (activeWordSpeechTimer) clearTimeout(activeWordSpeechTimer);
      activeSpeechTimer = null;
      activeWordSpeechTimer = null;
      activeWordUtterance = null;
      pendingYouTubeRange = null;
      const audio = document.getElementById('intensive-audio');
      audio?.pause();
      if (intensiveYouTubePlayer && typeof intensiveYouTubePlayer.pauseVideo === 'function') {
        intensiveYouTubePlayer.pauseVideo();
      }
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    }

    async function playIntensiveOriginalRange(start, end, rate = 1, onDone) {
      const mediaUrl = intensiveDocument.lesson?.media_url;
      if (mediaUrl && end > start) {
        const audio = document.getElementById('intensive-audio');
        if (!audio) return false;
        const absoluteUrl = new URL(mediaUrl, window.location.origin).href;
        if (audio.src !== absoluteUrl) audio.src = absoluteUrl;
        audio.currentTime = start;
        audio.playbackRate = rate;
        try {
          await audio.play();
          monitorOriginalPlayback({start, end, rate}, () => audio.currentTime, () => audio.pause(), onDone);
          return true;
        } catch (_) {
          return false;
        }
      }
      if (
        intensiveDocument.lesson?.source_type === 'youtube'
        && intensiveDocument.lesson?.video_id
        && end > start
      ) {
        playIntensiveYouTubeRange({start, end, rate, onDone});
        return true;
      }
      return false;
    }

    function monitorOriginalPlayback(range, getCurrentTime, pause, onDone) {
      const startedAt = Date.now();
      const safetyWindow = Math.max(
        12_000,
        ((range.end - range.start) / Math.max(.25, range.rate || 1)) * 4000 + 8000,
      );
      let enteredSentenceRange = false;
      activeSpeechTimer = setInterval(() => {
        const currentTime = Number(getCurrentTime());
        if (Number.isFinite(currentTime) && currentTime >= range.start - .35 && currentTime < range.end) {
          enteredSentenceRange = true;
        }
        if (
          (enteredSentenceRange && Number.isFinite(currentTime) && currentTime >= range.end - .04)
          || Date.now() - startedAt >= safetyWindow
        ) {
          clearInterval(activeSpeechTimer);
          activeSpeechTimer = null;
          pause();
          if (typeof onDone === 'function') onDone();
        }
      }, 80);
    }

    function hasOriginalMedia() {
      const lesson = intensiveDocument.lesson || {};
      return Boolean(
        lesson.media_url
        || (lesson.source_type === 'youtube' && lesson.video_id)
      );
    }

    function initIntensiveYouTube() {
      const lesson = intensiveDocument.lesson || {};
      if (lesson.source_type !== 'youtube' || !lesson.video_id || intensiveYouTubePlayer) return;
      const createPlayer = () => {
        if (!window.YT?.Player || intensiveYouTubePlayer) return;
        intensiveYouTubePlayer = new YT.Player('intensive-youtube-host', {
          width: 240,
          height: 135,
          videoId: lesson.video_id,
          playerVars: {playsinline: 1, rel: 0, controls: 0},
          events: {
            onReady: () => {
              intensiveYouTubeReady = true;
              if (pendingYouTubeRange) playIntensiveYouTubeRange(pendingYouTubeRange);
            },
          },
        });
      };
      if (window.YT?.Player) {
        createPlayer();
        return;
      }
      if (intensiveYouTubeApiLoading) return;
      intensiveYouTubeApiLoading = true;
      const previousReady = window.onYouTubeIframeAPIReady;
      window.onYouTubeIframeAPIReady = () => {
        if (typeof previousReady === 'function') previousReady();
        createPlayer();
      };
      const script = document.createElement('script');
      script.src = 'https://www.youtube.com/iframe_api';
      document.head.appendChild(script);
    }

    function playIntensiveYouTubeRange(range) {
      pendingYouTubeRange = range;
      if (!intensiveYouTubeReady || !intensiveYouTubePlayer) {
        initIntensiveYouTube();
        return;
      }
      pendingYouTubeRange = null;
      intensiveYouTubePlayer.seekTo(range.start, true);
      intensiveYouTubePlayer.setPlaybackRate(range.rate);
      intensiveYouTubePlayer.playVideo();
      monitorOriginalPlayback(
        {...range, rate: Number(intensiveYouTubePlayer.getPlaybackRate?.()) || range.rate || 1},
        () => intensiveYouTubePlayer?.getCurrentTime?.(),
        () => intensiveYouTubePlayer?.pauseVideo(),
        range.onDone,
      );
    }

    async function playIntensiveSentence(key) {
      const sentence = sentenceByKey(key);
      if (!sentence) return;
      stopIntensivePlayback();
      const rate = sentenceSpeed.get(Number(key)) || 1;
      const start = Number(sentence.start_seconds) || 0;
      const end = Number(sentence.end_seconds) || 0;
      if (await playIntensiveOriginalRange(start, end, rate)) return;
      NaturalTTS.speak(sentence.text, {lang:'en-US', rate:Math.max(.6, Math.min(1.3, rate))});
    }

    // ── 自动播放（按当前筛选的句子列表顺序）─────────────
    let intensiveAutoPlay = {active:false, loop:false, queue:[], index:0, timer:null, session:0};
    // 全局倍速：句子未单设倍速时自动播放用它；单句倍速（sentenceSpeed）优先
    let intensiveAutoplayRate = 1;

    function setIntensiveAutoplayRate(rate) {
      intensiveAutoplayRate = rate;
      const audio = document.getElementById('intensive-audio');
      if (audio && !audio.paused) audio.playbackRate = rate;
      if (intensiveYouTubePlayer && typeof intensiveYouTubePlayer.setPlaybackRate === 'function') {
        intensiveYouTubePlayer.setPlaybackRate(rate);
      }
    }

    function intensiveAutoplayOnce(fn) {
      let called = false;
      return () => { if (!called) { called = true; fn(); } };
    }

    function toggleIntensiveAutoLoop() {
      intensiveAutoPlay.loop = !intensiveAutoPlay.loop;
      const btn = document.getElementById('intensive-autoplay-loop');
      btn?.classList.toggle('active', intensiveAutoPlay.loop);
      btn?.setAttribute('aria-pressed', String(intensiveAutoPlay.loop));
    }

    function toggleIntensiveAutoPlay() {
      if (intensiveAutoPlay.active) { stopIntensiveAutoPlay(); return; }
      const queue = visibleSentences();
      if (!queue.length) return;
      intensiveAutoPlay.active = true;
      intensiveAutoPlay.queue = queue;
      intensiveAutoPlay.index = 0;
      intensiveAutoPlay.session++;
      const btn = document.getElementById('intensive-autoplay-btn');
      if (btn) { btn.textContent = '⏹ 停止播放'; btn.classList.add('active'); }
      intensiveAutoPlayStep();
    }

    function stopIntensiveAutoPlay() {
      const ap = intensiveAutoPlay;
      if (!ap.active && !ap.timer) return;
      ap.session++;
      ap.active = false;
      clearTimeout(ap.timer);
      ap.timer = null;
      stopIntensivePlayback();
      NaturalTTS.stop();
      document.querySelectorAll('.sentence-card.auto-playing').forEach(c => c.classList.remove('auto-playing'));
      const btn = document.getElementById('intensive-autoplay-btn');
      if (btn) { btn.textContent = '▶ 自动播放'; btn.classList.remove('active'); }
    }

    async function intensiveAutoPlayStep() {
      const ap = intensiveAutoPlay;
      if (!ap.active) return;
      if (ap.index >= ap.queue.length) {
        if (ap.loop) { ap.index = 0; } else { stopIntensiveAutoPlay(); return; }
      }
      const session = ap.session;
      const alive = () => ap.active && ap.session === session;
      const sentence = ap.queue[ap.index];
      if (intensiveViewMode === 'card' && Number(cardSentenceKey) !== Number(sentence.key)) {
        cardSentenceKey = Number(sentence.key);
        openSentenceKeys.add(Number(sentence.key));
        renderSentenceList();
      }
      document.querySelectorAll('.sentence-card.auto-playing').forEach(c => c.classList.remove('auto-playing'));
      const card = document.querySelector(`.sentence-card[data-key="${sentence.key}"]`);
      card?.classList.add('auto-playing');
      card?.scrollIntoView({behavior:'smooth', block:'center'});
      const advance = intensiveAutoplayOnce(() => {
        if (!alive()) return;
        ap.timer = setTimeout(() => {
          if (!alive()) return;
          ap.index += 1;
          intensiveAutoPlayStep();
        }, 1500);
      });
      const rate = sentenceSpeed.get(Number(sentence.key)) || intensiveAutoplayRate;
      const start = Number(sentence.start_seconds) || 0;
      const end = Number(sentence.end_seconds) || 0;
      const estimateMs = end > start
        ? ((end - start) / Math.max(.25, rate)) * 1000 + 6000
        : Math.max(5000, String(sentence.text || '').length * 110);
      const watchdog = setTimeout(advance, estimateMs);
      const onDone = () => { clearTimeout(watchdog); advance(); };
      stopIntensivePlayback();
      if (await playIntensiveOriginalRange(start, end, rate, onDone)) return;
      NaturalTTS.speak(sentence.text, {lang:'en-US', rate:Math.max(.6, Math.min(1.3, rate)), onEnd:onDone});
    }

    function speakIntensiveWordFallback(word) {
      if (!window.NaturalTTS || !word) return;
      stopIntensivePlayback();
      activeWordUtterance = NaturalTTS.speak(word, {
        lang:'en-US', rate:0.88, delay:80,
        onEnd:() => { activeWordUtterance = null; },
      });
    }

    function playIntensiveWord(word) {
      const normalized = String(word || '').toLowerCase().replace(/[^a-z0-9'-]/g, '');
      speakIntensiveWordFallback(normalized);

    async function generatePracticeHint(key) {
      const sentence = sentenceByKey(key);
      const result = document.querySelector(`[data-practice-hint="${key}"]`);
      const button = document.querySelector(`[data-generate-hint="${key}"]`);
      const input = document.querySelector(`[data-practice-input="${key}"]`);
      if (!sentence || !result) return '';
      const cacheKey = Number(key);
      const previousHints = [...(practiceHintHistory.get(cacheKey) || [])];
      const currentHint = practiceHintCache.get(cacheKey) || '';
      if (currentHint && !previousHints.includes(currentHint)) previousHints.push(currentHint);
      result.classList.add('open');
      result.textContent = '正在生成迁移练习…';
      if (button) {
        button.disabled = true;
        button.textContent = currentHint ? '💡 正在换题…' : '💡 正在生成…';
      }
      const oral = oralAnalysisCache.get(Number(key)) || {};
      try {
        const response = await eltCredits.billableFetch('practice_hint', '/api/hint', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            english: sentence.text,
            pattern_template: oral.template || '',
            vocab: practiceWords(sentence),
            previous_hints: previousHints,
          }),
        });
        const data = await response.json();
        if (!response.ok || data.error) throw new Error(data.error || '提示生成失败');
        const nextHint = String(data.hint || '').trim();
        if (!nextHint) throw new Error('AI 未返回新的中文提示');
        practiceHintCache.set(cacheKey, nextHint);
        practiceHintHistory.set(cacheKey, [...previousHints, nextHint]);
        result.textContent = nextHint;
        if (input) input.value = '';
        if (button) button.textContent = '💡 换一换';
        return nextHint;
      } catch (error) {
        result.textContent = `提示生成失败：${error.message}`;
        if (button) button.textContent = currentHint ? '💡 换一换' : '💡 生成中文提示';
        return '';
      } finally {
        if (button) button.disabled = false;
      }
    }

    async function submitPractice(key) {
      const sentence = sentenceByKey(key);
      const input = document.querySelector(`[data-practice-input="${key}"]`);
      const result = document.querySelector(`[data-practice-result="${key}"]`);
      if (!sentence || !input || !result) return;
      let hint = practiceHintCache.get(Number(key)) || '';
      if (!hint) hint = await generatePracticeHint(key);
      if (!hint) return;
      const userAnswer = input.value.trim();

      result.classList.add('open');
      result.textContent = isExample ? 'AI 正在生成自然范例…' : 'AI 正在批改你的表达…';
      const oral = oralAnalysisCache.get(Number(key)) || {};
      try {
        const response = await eltCredits.billableFetch(isExample ? 'practice_example' : 'practice_evaluation', '/api/practice', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            action: isExample ? 'example' : 'correct',
            hint_cn: hint,
            user_answer: userAnswer,
            english: sentence.text,
            pattern_template: oral.template || '',

    function setPracticeMicStatus(key, message, isError = false) {
      const status = document.querySelector(`[data-mic-status="${key}"]`);
