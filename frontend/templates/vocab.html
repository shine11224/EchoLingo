<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>词汇本</title>
  <style>
    :root {
      --bg: #f6f7f4; --surface: #ffffff; --surface-alt: #eef2ed;
      --ink: #202421; --muted: #687069; --line: #d9ded8;
      --brand: #2f6f5e; --brand-dark: #245548;
      --gold: #b8860b; --blue: #276fbf; --green: #3d7c47;
      --danger: #a33b2f; --shadow: 0 10px 28px rgba(31,44,36,.08);
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; color: var(--ink); background: var(--bg);
           font-family: Inter, "Segoe UI", "Microsoft YaHei", Arial, sans-serif; }
    button, input { font: inherit; }
    button { min-height: 36px; border: 1px solid var(--line); border-radius: 6px;
             padding: 6px 12px; background: var(--surface); color: var(--ink); cursor: pointer; }
    button:hover { border-color: var(--brand); }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .primary { background: var(--brand); border-color: var(--brand); color: #fff; }
    .primary:hover { background: var(--brand-dark); }

    /* ── Layout ── */
    .page-header {
      background: var(--surface); border-bottom: 1px solid var(--line);
      padding: 14px 24px; display: flex; align-items: center; gap: 16px;
      position: sticky; top: 0; z-index: 10;
    }
    .page-header a { color: var(--brand); text-decoration: none; font-size: 14px; }
    .page-header h1 { margin: 0; font-size: 20px; flex: 1; }
    .stats-badge { font-size: 13px; color: var(--muted); }

    .container { max-width: 860px; margin: 0 auto; padding: 24px 16px; }

    /* ── Today Panel ── */
    .today-panel {
      background: var(--surface); border-radius: 12px; padding: 20px 24px;
      box-shadow: var(--shadow); margin-bottom: 24px; border-left: 4px solid var(--danger);
    }
    .today-panel h2 { margin: 0 0 12px; font-size: 17px; display: flex; align-items: center; gap: 8px; }
    .due-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    .due-chip {
      background: #fef2f2; border: 1px solid #fca5a5; color: #991b1b;
      border-radius: 20px; padding: 4px 12px; font-size: 13px; font-weight: 600;
    }

    .story-area { margin-top: 16px; background: #fffbf0; border-radius: 8px; padding: 16px; }
    .story-box {
      line-height: 1.9; font-size: 15px;
      font-family: Georgia, 'Noto Serif SC', serif; color: #2d3748;
    }
    .story-box p { margin: 0 0 1em; }
    .story-box p:last-child { margin-bottom: 0; }
    .story-word {
      color: #059669; font-weight: 600; cursor: pointer;
      text-decoration: underline; text-decoration-style: dotted;
      text-decoration-color: #059669; text-underline-offset: 3px;
    }
    .story-word:hover { background: #d1fae5; border-radius: 3px; text-decoration: none; }
    .story-actions { display: flex; gap: 8px; align-items: center; justify-content: flex-end; margin-top: 12px; }
    .story-refresh-btn { font-size: 13px; padding: 5px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface-alt); cursor: pointer; color: var(--ink); }
    .story-refresh-btn:hover { background: var(--surface); border-color: var(--brand); color: var(--brand); }
    .story-loading { color: var(--muted); font-style: italic; font-size: 14px; }
    .gen-settings-card {
      background: #f0f5ee; border: 1px solid #c8ddc4; border-radius: 8px;
      padding: 14px 16px; margin-bottom: 16px;
    }
    .gen-settings-title { font-size: 13px; font-weight: 600; color: #4a6741; margin-bottom: 10px; }
    .gen-settings-row { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
    .gen-setting-item { display: flex; align-items: center; gap: 8px; }
    .gen-setting-item label { font-size: 13px; color: var(--muted); white-space: nowrap; }
    .gen-setting-item select {
      font-size: 13px; border: 1px solid var(--line); border-radius: 6px;
      padding: 4px 8px; background: #fff; cursor: pointer; min-width: 100px;
    }
    .story-word-chips { display: flex; flex-wrap: wrap; gap: 8px; min-height: 28px; margin-bottom: 14px; }
    .story-word-chip {
      display: inline-flex; align-items: center; gap: 3px;
      font-size: 13px; padding: 3px 8px; border-radius: 12px;
      background: #f0fdf4; border: 1px solid #86efac;
    }
    .story-word-chip .chip-x {
      font-size: 12px; cursor: pointer; color: var(--muted); line-height: 1;
      padding: 0 1px; margin-left: 1px;
    }
    .story-word-chip .chip-x:hover { color: var(--danger); }

    /* ── Controls ── */
    .controls {
      display: flex; gap: 10px; flex-wrap: wrap;
      margin-bottom: 16px; align-items: center;
    }
    .filter-group { display: flex; gap: 6px; flex-wrap: wrap; }
    .filter-btn {
      font-size: 13px; padding: 4px 12px; min-height: 30px; border-radius: 20px;
    }
    .filter-btn.active {
      background: var(--brand); border-color: var(--brand); color: #fff;
    }
    .sort-select {
      border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px;
      font-size: 13px; background: var(--surface); color: var(--ink); cursor: pointer;
    }
    .spacer { flex: 1; }

    .mastered-tag { background: #dcfce7; border-color: #86efac; color: #166534; cursor: pointer; }
    .mastered-tag:hover { background: #fef2f2; border-color: #fca5a5; color: #991b1b; }

    /* ── Word List ── */
    .word-list { display: flex; flex-direction: column; gap: 8px; }

    .word-card {
      background: var(--surface); border-radius: 10px; border: 1px solid var(--line);
      overflow: hidden; transition: box-shadow .15s;
    }
    .word-card:hover { box-shadow: var(--shadow); }

    .word-header {
      position: relative;
      display: flex; align-items: center; gap: 10px;
      padding: 12px 16px 12px 16px; padding-right: 44px; cursor: pointer; user-select: none;
    }
    .status-dot {
      width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0;
    }
    .status-dot.due  { background: var(--danger); }
    .status-dot.soon { background: var(--gold); }
    .status-dot.ok   { background: var(--green); }

    .word-text { font-size: 17px; font-weight: 700; min-width: 110px; }
    .word-ipa  { font-size: 13px; color: var(--muted); min-width: 90px; }
    .word-meaning { font-size: 14px; color: var(--ink); flex: 1; }
    .word-meta { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
    .tag {
      font-size: 11px; padding: 2px 7px; border-radius: 10px;
      font-weight: 600; background: var(--surface-alt); color: var(--muted);
    }
    .tag.due  { background: #fef2f2; color: #991b1b; }
    .tag.soon { background: #fffbeb; color: #92400e; }
    .tag.ok   { background: #f0fdf4; color: #166534; }
    .count-tag { font-size: 12px; color: var(--muted); }
    .speak-btn {
      min-height: 30px; padding: 4px 10px; font-size: 13px; flex-shrink: 0;
      border-radius: 20px;
    }
    .master-btn {
      position: absolute; top: 50%; right: 8px; transform: translateY(-50%);
      width: 28px; height: 28px; padding: 0; font-size: 16px; line-height: 28px; text-align: center;
      border: none; border-radius: 4px; color: var(--ink);
      background: transparent; opacity: 0; transition: opacity .15s;
      cursor: pointer; z-index: 1;
    }
    .word-card:hover .master-btn { opacity: 1; }
    .master-btn:hover { color: #166534; background: #f0fdf4; }
    .review-tag { cursor: pointer; user-select: none; }
    #review-popover {
      display: none; position: fixed; z-index: 9999;
      background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
      box-shadow: 0 4px 16px rgba(0,0,0,.12); padding: 10px 12px;
      gap: 6px; align-items: center; flex-wrap: wrap;
    }
    #review-popover.open { display: flex; }
    #review-popover span { font-size: 12px; color: var(--muted); }
    #review-popover button {
      font-size: 12px; padding: 3px 12px; border-radius: 10px;
      background: var(--surface-alt); border: 1px solid var(--line); cursor: pointer;
    }
    #review-popover button:hover { background: var(--brand); color: #fff; border-color: var(--brand); }

    /* ── Word Details ── */
    .word-details {
      border-top: 1px solid var(--line); padding: 16px 20px;
      background: var(--surface-alt); display: none;
    }
    .word-details.open { display: block; }

    .detail-section { margin-bottom: 14px; }
    .detail-label {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      color: var(--muted); letter-spacing: .05em; margin-bottom: 6px;
    }
    .detail-value { font-size: 14px; line-height: 1.6; }
    .collocations { display: flex; flex-wrap: wrap; gap: 6px; }
    .colloc-chip {
      background: var(--surface); border: 1px solid var(--line);
      border-radius: 6px; padding: 3px 9px; font-size: 13px;
    }
    .synonym-row { display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; margin-bottom: 4px; }
    .synonym-word { font-weight: 700; font-size: 14px; }
    .synonym-diff { font-size: 13px; color: var(--muted); }
    .example-item { font-size: 14px; color: #333; margin-bottom: 4px; }
    .context-item {
      font-size: 13px; background: var(--surface); border-left: 3px solid var(--brand);
      padding: 6px 10px; margin-bottom: 6px; border-radius: 0 6px 6px 0;
    }
    .context-lesson { font-size: 11px; color: var(--muted); margin-bottom: 2px; }
    .story-context-item { border-left-color: #059669; }
    .story-context-item .context-lesson { color: #059669; }
    .story-question-block { background: #f0fdf4; border: 1px solid #86efac; border-radius: 6px; padding: 10px 12px; margin-bottom: 12px; }
    .story-question-block .sq-label { font-size: 12px; color: #059669; font-weight: 600; margin-bottom: 4px; }
    .story-question-block .sq-text { font-size: 14px; color: #1a3a2a; line-height: 1.6; }
    .ielts-note {
      background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 6px;
      padding: 8px 12px; font-size: 13px; color: #1e40af;
    }

    .search-input {
      border: 1px solid var(--line); border-radius: 20px;
      padding: 6px 14px; font-size: 14px; background: var(--surface);
      color: var(--ink); outline: none; width: 180px; transition: border-color .15s;
    }
    .search-input:focus { border-color: var(--brand); }
    /* ── Practice Section ── */
    .practice-section { border-top: 1px dashed var(--line); padding-top: 14px; margin-top: 4px; }
    .hint-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
    .hint-text {
      flex: 1; font-size: 15px; font-weight: 600; color: var(--ink);
      min-width: 120px;
    }
    .hint-text.placeholder { color: var(--muted); font-weight: 400; font-style: italic; }
    .practice-textarea {
      width: 100%; border: 1px solid var(--line); border-radius: 8px;
      padding: 10px 12px; font-size: 14px; resize: vertical; min-height: 72px;
      background: var(--surface); color: var(--ink); outline: none;
    }
    .practice-textarea:focus { border-color: var(--brand); }
    .input-row { display: flex; gap: 6px; align-items: flex-start; margin-top: 8px; }
    .input-row .practice-textarea { margin-top: 0; flex: 1; }
    .mic-btn {
      flex-shrink: 0; width: 38px; height: 38px; border-radius: 50%;
      padding: 0; font-size: 17px; border: 1px solid var(--line);
      background: var(--surface); cursor: pointer; display: flex;
      align-items: center; justify-content: center; transition: all .2s;
    }
    .mic-btn:hover { border-color: var(--brand); }
    .mic-btn.recording {
      background: #fee2e2; border-color: var(--danger); color: var(--danger);
      animation: pulse 1s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(163,59,47,.4); }
                       50%      { box-shadow: 0 0 0 6px rgba(163,59,47,0); } }
    .practice-btns { display: flex; gap: 8px; margin-top: 8px; }
    .practice-result {
      margin-top: 12px; font-size: 14px; line-height: 1.7;
      background: var(--surface); border-radius: 8px; padding: 12px 14px;
      border-left: 3px solid var(--brand); display: none;
    }
    .practice-result.visible { display: block; }
    .result-label { font-size: 11px; font-weight: 700; text-transform: uppercase;
                    color: var(--muted); letter-spacing: .05em; margin-bottom: 4px; }
    .result-corrected { font-weight: 600; color: var(--green); margin-bottom: 8px; }
    .result-feedback li { margin-bottom: 3px; }
    .result-standard { font-weight: 600; color: var(--brand); margin-bottom: 4px; }
    .result-variant { color: var(--muted); margin-bottom: 8px; }
    .result-keypoints li { margin-bottom: 3px; color: #444; }
    .result-word { cursor:pointer; border-bottom:1px dashed #5c8c5a; display:inline; }
    .result-word:hover { background:#f0f7f0; border-radius:2px; }
    .result-word-saved { color:#5c8c5a; border-bottom-style:solid; }
    #word-save-popover { position:fixed; background:#fff; border:1px solid #d1d5db; border-radius:8px; box-shadow:0 4px 16px rgba(0,0,0,.12); padding:8px 12px; display:flex; align-items:center; gap:6px; font-size:13px; z-index:1000; }
    #word-save-popover.hidden { display:none; }
    #word-save-tag-input { border:1px solid #d1d5db; border-radius:4px; padding:3px 6px; font-size:12px; width:80px; outline:none; }

    .empty-state {
      text-align: center; padding: 60px 20px; color: var(--muted);
    }
    .empty-state p { font-size: 16px; }
    .hidden { display: none !important; }
  </style>
</head>

<div class="page-header">
  <a href="/">← 返回课程</a>
  <h1>📖 词汇本</h1>
  <span class="stats-badge" id="stats-badge">加载中…</span>
  <div style="display:flex;gap:8px;align-items:center;margin-left:auto;">
    <a href="/api/export/vocab?format=anki" download="vocab_anki.txt"
       style="font-size:13px;padding:6px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);text-decoration:none;white-space:nowrap;">
      📤 导出 Anki
    </a>
    <a href="/api/export/vocab?format=csv" download="vocab.csv"
       style="font-size:13px;padding:6px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);text-decoration:none;white-space:nowrap;">
      📊 导出 CSV
    </a>
  </div>
</div>

<div class="container">

  <!-- Today's Review Panel -->
  <div class="today-panel" id="today-panel">
    <div class="gen-settings-card">
      <div class="gen-settings-title">生成设置</div>
      <div class="gen-settings-row">
        <div class="gen-setting-item">
          <label>词汇量</label>
          <select id="story-level-sel">
            <option value="A2">A2（~1K词）</option>
            <option value="B1" selected>B1（~3K词）</option>
            <option value="B2">B2（~5K词）</option>
            <option value="C1">C1（8K+）</option>
          </select>
        </div>
        <div class="gen-setting-item">
          <label>故事主题</label>
          <select id="story-theme-sel">
            <option value="">默认不指定</option>
            <option value="科技">科技</option>
            <option value="旅行">旅行</option>
            <option value="职场">职场</option>
            <option value="日常生活">日常生活</option>
          </select>
        </div>
        <div class="gen-setting-item">
          <label>词汇来源</label>
          <select id="story-source-sel" onchange="setStorySource(this.value)">
            <option value="due">今日复习</option>
            <option value="today" selected>今日学习</option>
            <option value="all">全部</option>
          </select>
        </div>
      </div>
    </div>
    <div class="story-word-chips" id="story-word-chips"></div>
    <div style="margin-top:14px">
      <button class="primary" id="gen-story-btn" onclick="generateStory()">✨ 生成今日记忆故事</button>
    </div>
    <div class="story-area" id="story-area">
      <div class="story-box" id="story-text"></div>
      <div class="story-actions">
        <span class="story-loading hidden" id="story-status"></span>
        <button class="story-refresh-btn hidden" id="story-refresh-btn" onclick="generateStory(true)" title="换一个新故事">🔄 换一换</button>
      </div>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <div class="filter-group" id="filter-group">
      <button class="filter-btn active" data-filter="all" onclick="setFilter('all',this)">全部</button>
      <button class="filter-btn" data-filter="today-plan" onclick="setFilter('today-plan',this)">今日练习</button>
      <button class="filter-btn" data-filter="ai-recommended" onclick="setFilter('ai-recommended',this)">AI 推荐</button>
      <button class="filter-btn" data-filter="due" onclick="setFilter('due',this)">待复习</button>
      <button class="filter-btn" data-filter="recent" onclick="setFilter('recent',this)">最近加入</button>
      <button class="filter-btn" data-filter="today" onclick="setFilter('today',this)">今日收藏</button>
    </div>
    <input class="search-input" id="search-input" type="search"
           placeholder="搜索单词…" oninput="setSearch(this.value)">
    <span class="spacer"></span>
    <select class="sort-select" onchange="setSort(this.value)">
      <option value="review">按复习状态</option>
      <option value="count">按学习次数</option>
      <option value="recent">按最近学习</option>
      <option value="alpha">按字母</option>
    </select>
  </div>

  <!-- Word List -->
  <div class="word-list" id="word-list">
    <div class="empty-state"><p>加载中…</p></div>
  </div>

</div>

<script>
  // ── Data & State ──────────────────────────────────────
  let vocabData = {};       // word → entry
  let knownSet = new Set();
  let currentFilter = 'all';
  let currentSort = 'review';
  let currentSearch = '';
  const todayPlanWords = new Set();
  const aiRecommendedWords = new Set();
  const INTERVALS = [1, 3, 7, 14, 30, 60];  // days after nth study
  const DAILY_REVIEW_TARGET = 10;

  function todayKey() {
    const d = new Date();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${d.getFullYear()}-${m}-${day}`;
  }

  function isTodayLearned(entry) {
    return (entry.first_studied || '') === todayKey();
  }

  // ── Review Status ─────────────────────────────────────
  function reviewStatus(entry) {
    const today = new Date(); today.setHours(0, 0, 0, 0);
    if (entry.next_review) {
      const nr = new Date(entry.next_review + 'T00:00:00');
      const d  = Math.floor((nr - today) / 86400000);
      if (d <= 0) return { key: 'due',  label: '今日复习', order: 0 };
      if (d === 1) return { key: 'soon', label: '明日',    order: 1 };
      return               { key: 'ok',   label: `${d}天后`, order: 2 };
    }
    const count       = entry.count || 1;
    const lastStudied = new Date(entry.last_studied + 'T00:00:00');
    const daysSince   = Math.floor((today - lastStudied) / 86400000);
    const interval    = INTERVALS[Math.min(count - 1, INTERVALS.length - 1)];
    const daysLeft    = interval - daysSince;
    if (daysLeft <= 0) return { key: 'due',  label: '今日复习', order: 0 };
    if (daysLeft === 1) return { key: 'soon', label: '明日',     order: 1 };
    return               { key: 'ok',   label: `${daysLeft}天后`, order: 2 };
  }

  // ── Render ────────────────────────────────────────────
  function renderList() {
    const list = document.getElementById('word-list');
    let entries = Object.entries(vocabData)
      .filter(([w]) => !w.startsWith('__'));  // skip __stories__ etc.

    // Search
    if (currentSearch) {
      const q = currentSearch.toLowerCase();
      entries = entries.filter(([w, e]) => {
        const meaning = (e.cached_analysis?.basic_meaning || '').toLowerCase();
        return w.includes(q) || meaning.includes(q);
      });
    }

    // Filter
    if (currentFilter !== 'all') {
      if (currentFilter === 'due') {
        entries = entries.filter(([, e]) => reviewStatus(e).key === 'due');
      } else if (currentFilter === 'today-plan') {
        entries = entries.filter(([word]) => todayPlanWords.has(word.toLowerCase()));
      } else if (currentFilter === 'ai-recommended') {
        entries = entries.filter(([word]) => aiRecommendedWords.has(word.toLowerCase()));
      } else if (currentFilter === 'today') {
        entries = entries.filter(([, e]) => isTodayLearned(e));
      } else if (currentFilter === 'recent') {
        // Show words added in the last 7 days, sorted by first_studied desc
        const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - 7);
        entries = entries.filter(([, e]) => {
          const fs = e.first_studied;
          return fs && new Date(fs + 'T00:00:00') >= cutoff;
        });
      } else {
        // 词表筛选：按词表成员资格过滤；词表尚未载入时先显示加载态，载入完成后重渲染
        const wordSet = wordlistWordsCache[currentFilter];
        if (!wordSet) {
          list.innerHTML = '<div class="empty-state"><p>词表载入中…</p></div>';
          return;
        }
        entries = entries.filter(([w]) => wordSet.has(w.toLowerCase()));
      }
    }

    // Sort
    if (currentFilter === 'recent') {
      // "最近加入" always sorts by first_studied desc
      entries.sort(([, ea], [, eb]) => (eb.first_studied || '') > (ea.first_studied || '') ? 1 : -1);
    } else {
      entries.sort(([wa, ea], [wb, eb]) => {
        if (currentSort === 'review') {
          const sa = reviewStatus(ea).order, sb = reviewStatus(eb).order;
          if (sa !== sb) return sa - sb;
          return wb > wa ? -1 : 1;
        }
        if (currentSort === 'count')  return eb.count - ea.count;
        if (currentSort === 'recent') return (eb.last_studied || '') > (ea.last_studied || '') ? 1 : -1;
        return wa < wb ? -1 : 1;
      });
    }

    if (!entries.length) {
      list.innerHTML = '<div class="empty-state"><p>暂无词汇</p></div>';
      return;
    }

    list.innerHTML = entries.map(([word, entry]) => buildCard(word, entry)).join('');
  }

  function buildCard(word, entry) {
    const st  = reviewStatus(entry);
    const an  = entry.cached_analysis || {};
    const ipa = an.ipa || '';
    const meaning = an.basic_meaning || '';
    const level   = (entry.level || '').replace('cefr_', '').toUpperCase();
    const todayTag = isTodayLearned(entry) ? '<span class="tag soon">今日收藏</span>' : '';
    const todayPlanTag = todayPlanWords.has(word.toLowerCase()) ? '<span class="tag soon">今日练习</span>' : '';
    const aiRecommendedTag = aiRecommendedWords.has(word.toLowerCase()) ? '<span class="tag">AI 推荐</span>' : '';

    const collocations = (an.collocations || []).map(c =>
      `<span class="colloc-chip">${esc(c)}</span>`).join('');

    const synonyms = (an.synonyms || []).map(s =>
      `<div class="synonym-row">
         <span class="synonym-word">${esc(s.word)}</span>
         <span class="synonym-diff">${esc(s.difference || '')}</span>
       </div>`).join('');

    const examples = (an.examples || []).map(e =>
      `<div class="example-item">· ${esc(e)}</div>`).join('');

    const contexts = (entry.contexts || []).map(c =>
      `<div class="context-item">
         <div class="context-lesson">${esc(c.lesson || '')}</div>
         <div>${esc(c.sentence || '')}</div>
       </div>`).join('');

    const ielts = an.ielts_note
      ? `<div class="detail-section">
           <div class="detail-label">雅思注释</div>
           <div class="ielts-note">${esc(an.ielts_note)}</div>
         </div>` : '';

    const usage = an.usage
      ? `<div class="detail-section">
           <div class="detail-label">用法</div>
           <div class="detail-value">${esc(an.usage)}</div>
         </div>` : '';

    return `
    <div class="word-card" data-word="${esc(word)}" data-status="${st.key}" data-level="${esc(entry.level||'')}">
      <div class="word-header" onclick="toggleCard(this)">
        <span class="status-dot ${st.key}"></span>
        <span class="word-text">${esc(word)}</span>
        <span class="word-ipa">${esc(ipa)}</span>
        <span class="word-meaning">${esc(meaning)}</span>
        <div class="word-meta">
          ${level ? `<span class="tag">${esc(level)}</span>` : ''}
          ${todayPlanTag}
          ${aiRecommendedTag}
          ${todayTag}
          <span class="tag ${st.key} review-tag" onclick="toggleReviewAdjust(event,'${esc(word)}')" title="点击调整复习时间">${esc(st.label)}</span>
          <span class="count-tag">${entry.count}次</span>
          ${knownSet.has(word) ? `<button class="tag mastered-tag" onclick="unmaster(event,'${esc(word)}')">✓ 已掌握 ×</button>` : ''}
        </div>
        <button class="speak-btn" onclick="speakWord(event,'${esc(word)}')">▶</button>
        <button class="master-btn" onclick="masterWord(event,'${esc(word)}')" title="标记已掌握：移出生词本，不再高亮">✓</button>
      </div>
      <div class="word-details">
        ${an.en_definition ? `<div class="detail-section">
          <div class="detail-label">英文释义</div>
          <div class="detail-value">${esc(an.en_definition)}</div>
        </div>` : ''}
        ${collocations ? `<div class="detail-section">
          <div class="detail-label">常见搭配</div>
          <div class="collocations">${collocations}</div>
        </div>` : ''}
        ${synonyms ? `<div class="detail-section">
          <div class="detail-label">近义词对比</div>${synonyms}
        </div>` : ''}
        ${examples ? `<div class="detail-section">
          <div class="detail-label">例句</div>${examples}
        </div>` : ''}
        ${usage}
        ${ielts}
        ${contexts ? `<div class="detail-section">
          <div class="detail-label">学习语境</div>${contexts}
        </div>` : ''}
        <div class="detail-section practice-section">
          <div class="detail-label">情景造句练习</div>
          <div class="hint-row">
            <span class="hint-text placeholder" id="hint-${esc(word)}">点击「生成提示」获取中文造句提示</span>
            <button onclick="genVocabHint('${esc(word)}')">💡 生成提示</button>
          </div>
          <div class="input-row">
            <textarea class="practice-textarea" id="answer-${esc(word)}"
              placeholder="写下你的英文翻译，或点麦克风语音输入…"
              oninput="updatePracticeBtn('${esc(word)}',this.value)"></textarea>
            <button class="mic-btn" id="mic-${esc(word)}"
              title="语音输入" onclick="toggleVoiceInput('${esc(word)}')">🎤</button>
          </div>
          <div class="practice-btns">
            <button onclick="markReviewed(event,'${esc(word)}')">已复习</button>
            <button class="primary" id="practice-btn-${esc(word)}" onclick="submitVocabPractice('${esc(word)}')">📖 生成范例</button>
          </div>
          <div class="practice-result" id="result-${esc(word)}"></div>
        </div>
      </div>
    </div>`;
  }

  function toggleCard(header) {
    const details = header.nextElementSibling;
    details.classList.toggle('open');
  }

  // ── Today Panel ───────────────────────────────────────
  function renderTodayPanel(entries) {
    const source = (document.getElementById('story-source-sel') || {}).value || 'today';
    setStorySource(source, entries);
  }

  async function markReviewed(event, word) {
    event.stopPropagation();
    const btn = event.currentTarget;
    btn.disabled = true;
    btn.textContent = '记录中…';
    try {
      const data = await fetch('/api/review-word', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({word})
      }).then(r => r.json());
      if (data.error) throw new Error(data.error);
      if (vocabData[word]) {
        vocabData[word].count = data.count;
        vocabData[word].last_studied = data.last_studied;
      }
      const entries = Object.entries(vocabData).filter(([w]) => !w.startsWith('__'));
      renderTodayPanel(entries);
      renderList();
      document.getElementById('summary').textContent =
        `共 ${entries.length} 个词 · ${entries.filter(([,e]) => reviewStatus(e).key === 'due').length} 个今日待复习`;
    } catch (e) {
      btn.disabled = false;
      btn.textContent = '已复习';
      alert(`记录失败：${e.message}`);
    }
  }

  // ── Story ──────────────────────────────────────────────
  let _storyWordSet = new Set();

  function setStorySource(source, entriesOverride) {
    const entries = entriesOverride || Object.entries(vocabData || {}).filter(([w]) => !w.startsWith('__'));
    let words;
    if (source === 'due')        words = entries.filter(([,e]) => reviewStatus(e).key === 'due').map(([w]) => w);
    else if (source === 'today') words = entries.filter(([,e]) => isTodayLearned(e)).map(([w]) => w);
    else                         words = entries.map(([w]) => w).slice(0, 30);
    _storyWordSet = new Set(words);
    renderStoryWordChips();
    window._dueWords = [..._storyWordSet];
  }

  function removeStoryWord(word) {
    _storyWordSet.delete(word);
    renderStoryWordChips();
    window._dueWords = [..._storyWordSet];
  }

  function renderStoryWordChips() {
    const c = document.getElementById('story-word-chips');
    if (!c) return;
    if (!_storyWordSet.size) {
      c.innerHTML = '<span style="font-size:13px;color:var(--muted)">暂无词汇，请切换词汇来源</span>';
      return;
    }
    c.innerHTML = [..._storyWordSet].map(w =>
      `<span class="story-word-chip">${esc(w)}<span class="chip-x" onclick="removeStoryWord('${esc(w)}')" title="移除">×</span></span>`
    ).join('');
  }

  function showNoKeyToast() {
    let t = document.getElementById('no-key-toast');
    if (!t) {
      t = document.createElement('div');
      t.id = 'no-key-toast';
      t.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:10px 20px;border-radius:8px;font-size:14px;z-index:9999;pointer-events:none;opacity:0;transition:opacity .2s';
      document.body.appendChild(t);
    }
    t.textContent = '请先在 .env 中配置 AI_API_KEY';
    t.style.opacity = '1';
    clearTimeout(t._timer);
    t._timer = setTimeout(() => { t.style.opacity = '0'; }, 3000);
  }

  // ── Story Generation ──────────────────────────────────
  async function generateStory(forceNew = false) {
    if (!window._hasAI) { showNoKeyToast(); return; }
    const btn    = document.getElementById('gen-story-btn');
    const area   = document.getElementById('story-area');
    const textEl = document.getElementById('story-text');
    const status = document.getElementById('story-status');
    const refreshBtn = document.getElementById('story-refresh-btn');

    const learner_level = (document.getElementById('story-level-sel') || {}).value || 'B1';
    const theme = (document.getElementById('story-theme-sel') || {}).value || '';

    btn.disabled = true;
    if (refreshBtn) refreshBtn.disabled = true;
    btn.textContent = '生成中…';
    area.classList.remove('hidden');
    textEl.textContent = '';
    status.classList.remove('hidden');
    status.textContent = '正在调用 AI，约 10 秒…';

    try {
      const res  = await eltCredits.billableFetch('vocab_story', '/api/vocab-story', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ words: [..._storyWordSet], learner_level, theme, force_new: forceNew }),
      });
      const raw = await res.text();
      let data; try { data = JSON.parse(raw); } catch(_) { throw new Error('服务器返回非 JSON 响应，请检查 AI Key 配置'); }
      if (!res.ok) throw new Error(data?.detail || data?.error || res.statusText);
      if (data.error) throw new Error(data.error);
      let storyText = data.story || '';
      if (storyText.trim().startsWith('{')) { try { const p = JSON.parse(storyText); storyText = p.story_content || p.story || storyText; } catch(_) {} }
      storyText = storyText.replace(/\*\*(.+?)\*\*/g, '$1');
      textEl.innerHTML = highlightStoryWords(storyText, [..._storyWordSet]);
      if (data.used_words && data.used_words.length) {
        fetch('/api/story-context', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({used_words:data.used_words})}).catch(()=>{});
      }
      injectStoryResults(data.used_words);
      btn.textContent = '✨ 重新生成';
      if (refreshBtn) refreshBtn.classList.remove('hidden');
    } catch (e) {
      textEl.textContent = '生成失败：' + e.message;
      btn.textContent = '✨ 生成今日记忆故事';
    } finally {
      btn.disabled = false;
      if (refreshBtn) refreshBtn.disabled = false;
      status.classList.add('hidden');
    }
  }

  // ── Story word highlighting & navigation ─────────────
  function _highlightLine(line, regex) {
    const parts = []; let last = 0, m;
    while ((m = regex.exec(line)) !== null) {
      parts.push(esc(line.slice(last, m.index)));
      const w = m[1].toLowerCase();
      parts.push(`<strong class="story-word" onclick="jumpToWord('${esc(w)}')">${esc(m[1])}</strong>`);
      last = m.index + m[1].length;
    }
    parts.push(esc(line.slice(last)));
    return parts.join('');
  }
  function highlightStoryWords(text, words) {
    const regex = words.length
      ? new RegExp(`\\b(${[...words].sort((a,b)=>b.length-a.length).map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')})\\b`, 'gi')
      : null;
    return text.split(/\n\n+/).map(para => {
      const lines = para.split('\n').map(line => regex ? _highlightLine(line, regex) : esc(line));
      return `<p>${lines.join('<br>')}</p>`;
    }).join('');
  }

  function jumpToWord(word) {
    const card = document.querySelector(`.word-card[data-word="${word}"]`);
    if (!card) return;
    // Expand details if not already open
    const details = card.querySelector('.word-details');
    if (details && !details.classList.contains('open')) details.classList.add('open');
    // Scroll into view
    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
    // Brief highlight ring
    card.style.outline = '2px solid var(--brand)';
    card.style.outlineOffset = '2px';
    setTimeout(() => { card.style.outline = ''; card.style.outlineOffset = ''; }, 1800);
  }

  function injectStoryResults(usedWords) {
    for (const item of (usedWords || [])) {
      const word = (item.target_word || '').trim().toLowerCase();
      const sentence = (item.sentence || '').trim();
      if (!word || !sentence) continue;
      const card = document.querySelector(`.word-card[data-word="${word}"]`);
      if (!card) continue;
      let section = [...card.querySelectorAll('.detail-section')].find(
        s => s.querySelector('.detail-label')?.textContent?.trim() === '学习语境'
      );
      if (!section) {
        section = document.createElement('div');
        section.className = 'detail-section';
        section.innerHTML = '<div class="detail-label">学习语境</div>';
        const ps = card.querySelector('.practice-section');
        if (ps) ps.before(section); else card.querySelector('.word-details')?.appendChild(section);
      }
      if (section.querySelector('.story-context-item')) continue;
      const el = document.createElement('div');
      el.className = 'context-item story-context-item';
      el.innerHTML = `<div class="context-lesson">📖 故事语境</div><div>${esc(sentence)}</div>`;
      section.appendChild(el);
    }
  }

  // ── Speech ────────────────────────────────────────────
  function speakWord(evt, word) {
    evt.stopPropagation();
    NaturalTTS.speak(word, {lang:'en-US', rate:0.88});

  function speakStory() {
    const text = document.getElementById('story-text').innerText;
    if (!text) return;
    document.getElementById('stop-btn').classList.remove('hidden');
    NaturalTTS.speak(text, {lang:'en-US', rate:0.94,

  function stopSpeech() {
    NaturalTTS.stop();
    document.getElementById('stop-btn').classList.add('hidden');
  }

  // ── Wordlist Filter Buttons ────────────────────────────
  function renderWordlistFilters(wordlists) {
    const group = document.getElementById('filter-group');
    wordlists
      .filter(wl => wl.type !== 'exclude')
      .forEach(wl => {
        const btn = document.createElement('button');
        btn.className = 'filter-btn';
        btn.dataset.filter = wl.key;
        btn.textContent = wl.tag;
        btn.onclick = () => setFilter(wl.key, btn);
        group.appendChild(btn);
      });

  // 词表筛选按「词是否属于该词表」过滤：entry.level 存的是来源标记（v2/自由文本），
  // 与词表 key 永不匹配，旧等值比较导致点任何自带词表都为空。
  const wordlistWordsCache = {};
  let wordlistFilterToken = 0;
  async function ensureWordlistWords(key) {
    if (wordlistWordsCache[key]) return wordlistWordsCache[key];
    let words = [];
    try {
      const resp = await fetch(`/wordlists/${encodeURIComponent(key)}`);
      if (resp.ok) {
        const data = await resp.json().catch(() => ({}));
        words = Array.isArray(data.words) ? data.words : Object.keys(data.words || {});
      }
    } catch (err) { /* 网络失败按空集处理，避免卡死筛选 */ }
    wordlistWordsCache[key] = new Set(words.map(w => String(w).toLowerCase()));
    return wordlistWordsCache[key];
  }

  // ── Filter / Sort ──────────────────────────────────────
  function setFilter(val, btn) {
    currentFilter = val;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderList();
    const fixed = ['all', 'due', 'today', 'recent', 'today-plan', 'ai-recommended'];
    if (!fixed.includes(val) && !wordlistWordsCache[val]) {
      const token = ++wordlistFilterToken;
      ensureWordlistWords(val).then(() => {
        if (token === wordlistFilterToken && currentFilter === val) renderList();
      });
    }
  }

  function setSort(val) {
    currentSort = val;
    renderList();
  }

  function setSearch(val) {
    currentSearch = val.trim();
    renderList();
  }

  // ── Vocab Practice ───────────────────────────────────
  async function genVocabHint(word) {
    const hintEl = document.getElementById(`hint-${word}`);
    const entry  = vocabData[word] || {};
    const an     = entry.cached_analysis || {};
    const example = (an.examples || [])[0] || '';

    hintEl.textContent = '生成中…';
    hintEl.classList.remove('placeholder');
    try {
      const res  = await eltCredits.billableFetch('practice_hint', '/api/hint', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ english: example, vocab: [word], pattern_template: '' }),
      });
      const data = await res.json();
      hintEl.textContent = data.hint || '生成失败';
    } catch (e) {
      hintEl.textContent = '生成失败：' + e.message;
      hintEl.classList.add('placeholder');
    }
  }

  function updatePracticeBtn(word, val) {
    const btn = document.getElementById(`practice-btn-${word}`);
    if (!btn) return;
    btn.textContent = val.trim() ? '✓ 批改' : '📖 生成范例';
  }

  async function submitVocabPractice(word) {
    const hintEl   = document.getElementById(`hint-${word}`);
    const answerEl = document.getElementById(`answer-${word}`);
    const resultEl = document.getElementById(`result-${word}`);
    const hint_cn  = hintEl.textContent.trim();
    const answer   = answerEl.value.trim();
    const mode     = answer ? 'correction' : 'example';
    const entry    = vocabData[word] || {};
    const an       = entry.cached_analysis || {};
    const example  = (an.examples || [])[0] || '';

    if (!hint_cn || hint_cn === '点击「生成提示」获取中文造句提示') {
      resultEl.classList.add('visible');
      resultEl.innerHTML = '<span style="color:var(--muted)">请先生成造句提示。</span>';
      return;
    }

    resultEl.classList.add('visible');
    resultEl.innerHTML = '<span style="color:var(--muted)">DeepSeek 分析中…</span>';

    try {
      const res  = await eltCredits.billableFetch('practice_evaluation', '/api/practice', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          hint_cn, english: example, vocab: [word],
          pattern_template: '', user_answer: mode === 'correction' ? answer : '',
        }),
      });
      const data = await res.json();
      resultEl.innerHTML = renderVocabResult(data);
    } catch (e) {
      resultEl.innerHTML = `<span style="color:var(--danger)">请求失败：${esc(e.message)}</span>`;
    }
  }

  let _pendingSaveWord = '';

  function openWordSavePopover(e, word) {
    e.stopPropagation();
    _pendingSaveWord = word;
    const pop = document.getElementById('word-save-popover');
    const inp = document.getElementById('word-save-tag-input');
    const lbl = document.getElementById('word-save-label');
    if (!pop || !inp || !lbl) return;
    lbl.textContent = word;
    inp.value = '';
    pop.classList.remove('hidden');
    const r = e.target.getBoundingClientRect();
    pop.style.left = Math.min(r.left, window.innerWidth - 240) + 'px';
    pop.style.top = (r.bottom + 6) + 'px';
    inp.focus();
  }

  function closeWordSavePopover() {
    document.getElementById('word-save-popover')?.classList.add('hidden');
    _pendingSaveWord = '';
  }

  async function confirmSaveWord() {
    const word = _pendingSaveWord;
    const tag = (document.getElementById('word-save-tag-input')?.value || '').trim();
    if (!word) return;
    closeWordSavePopover();
    try {
      const today = new Date().toISOString().slice(0, 10);
      await fetch('/log-word', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ word, level: tag, today })
      });
      document.querySelectorAll('.result-word').forEach(el => {
        if (el.textContent.toLowerCase() === word) el.classList.add('result-word-saved');
      });
    } catch(err) { console.error('保存失败', err); }
  }

  function makeClickableWords(text) {
    if (!text) return '';
    return esc(text).replace(/([a-zA-Z][a-zA-Z'\-]*)/g, (m) => {
      const w = m.toLowerCase().replace(/'/g, "\\'");
      return `<span class="result-word" onclick="openWordSavePopover(event,'${w}')">${m}</span>`;
    });
  }

  function renderVocabResult(data) {
    if (data.error) return `<span style="color:var(--danger)">${esc(data.error)}</span>`;
    if (data.mode === 'correction') {
      const fb = (data.feedback || []).map(f => `<li>${esc(f)}</li>`).join('');
      const v = data.variant ? `<div class="result-label" style="margin-top:8px">变体表达</div><div class="result-variant">${makeClickableWords(data.variant)}</div>` : '';
      return `<div class="result-label">修改后版本</div><div class="result-corrected">${makeClickableWords(data.corrected || '')}</div><div class="result-label">反馈</div><ul class="result-feedback">${fb}</ul>${v}`;
    }
    const kps = (data.key_points || []).map(k => `<li>${esc(k)}</li>`).join('');
    return `<div class="result-label">标准翻译</div><div class="result-standard">${makeClickableWords(data.standard || '')}</div><div class="result-label">变体表达</div><div class="result-variant">${makeClickableWords(data.variant || '')}</div>${kps ? `<div class="result-label">表达要点</div><ul class="result-keypoints">${kps}</ul>` : ''}`;
  }

  // ── Voice Input ──────────────────────────────────────
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  let _activeRecognition = null;   // only one active at a time
  let _activeWord        = null;

  function toggleVoiceInput(word) {
    if (!SpeechRecognition) {
      alert('您的浏览器不支持语音输入（请使用 Chrome / Edge）。');
      return;
    }

    // Stop any ongoing recognition
    if (_activeRecognition) {
      _activeRecognition.stop();
      if (_activeWord && _activeWord !== word) {
        // Was recording a different card — just stop that one, don't start new
        return;
      }
      // Same card toggle: stop
      return;
    }

    const textarea = document.getElementById(`answer-${word}`);
    const micBtn   = document.getElementById(`mic-${word}`);

    const recognition       = new SpeechRecognition();
    recognition.lang        = 'en-US';
    recognition.continuous  = true;    // keep listening until stopped
    recognition.interimResults = true; // show live partial results

    let interimEl = null;

    recognition.onstart = () => {
      _activeRecognition = recognition;
      _activeWord        = word;
      micBtn.classList.add('recording');
      micBtn.title = '点击停止录音';
      // Placeholder for interim text
      interimEl = document.createElement('span');
      interimEl.style.cssText = 'color:#aaa;font-style:italic';
      textarea.parentNode.insertBefore(interimEl, textarea.nextSibling);
    };

    recognition.onresult = (e) => {
      let interim = '';
      let final   = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const t = e.results[i][0].transcript;
        if (e.results[i].isFinal) final += t;
        else interim += t;
      }
      if (final) {
        textarea.value += (textarea.value && !textarea.value.endsWith(' ') ? ' ' : '') + final;
      }
      if (interimEl) interimEl.textContent = interim ? `「${interim}」` : '';
    };

    recognition.onerror = (e) => {
      if (e.error !== 'aborted') console.warn('Speech error:', e.error);
    };

    recognition.onend = () => {
      micBtn.classList.remove('recording');
      micBtn.title = '语音输入';
      if (interimEl) { interimEl.remove(); interimEl = null; }
      _activeRecognition = null;
      _activeWord        = null;
    };

    recognition.start();
  }

  // ── Utilities ─────────────────────────────────────────
  function esc(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Init ──────────────────────────────────────────────
  const sessionMastered = new Set();  // 本次会话中标记掌握的词（卡片即时移除，可撤销）
  let masteredBase = 0;               // 服务端已掌握总数（my_mastered 虚拟词表）

  function updateStatsBadge() {
    const entries = Object.entries(vocabData).filter(([w]) => !w.startsWith('__') && !sessionMastered.has(w));
    const dueN = entries.filter(([,e]) => reviewStatus(e).key === 'due').length;
    document.getElementById('stats-badge').textContent =
      `共 ${entries.length} 个词 · ${dueN} 个今日待复习 · 已掌握 ${masteredBase + sessionMastered.size} 词（粗略词汇量估算）`;
  }

  async function masterWord(event, word) {
    event.stopPropagation();
    const btn = event.currentTarget;
    btn.disabled = true;
    try {
      const resp = await fetch(`/api/vocab-review/${encodeURIComponent(word)}/lifecycle`, {
        method: 'PATCH',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({mastered: true}),
      });
      if (!resp.ok) throw new Error('master failed');
      sessionMastered.add(word);
      knownSet.add(word);
      document.querySelector(`.word-card[data-word="${word}"]`)?.remove();
      updateStatsBadge();
      showMasterUndo(word);
    } catch(e) { btn.disabled = false; }
  }

  function showMasterUndo(word) {
    const toast = document.createElement('div');
    toast.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:8px 14px;border-radius:8px;font-size:13px;z-index:99;';
    toast.innerHTML = `已掌握「${esc(word)}」，已移出生词本 <button type="button" style="margin-left:8px;background:none;border:1px solid #fff;color:#fff;border-radius:6px;cursor:pointer;padding:1px 8px;">撤销</button>`;
    toast.querySelector('button').onclick = async () => {
      await fetch(`/api/vocab-review/${encodeURIComponent(word)}/lifecycle`, {
        method: 'PATCH',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({mastered: false}),
      });
      sessionMastered.delete(word);
      knownSet.delete(word);
      toast.remove();
      renderList();
      updateStatsBadge();
    };
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 8000);
  }

  let _reviewPopoverWord = null;

  function toggleReviewAdjust(event, word) {
    event.stopPropagation();
    const pop = document.getElementById('review-popover');
    if (_reviewPopoverWord === word && pop.classList.contains('open')) {
      pop.classList.remove('open'); _reviewPopoverWord = null; return;
    }
    _reviewPopoverWord = word;
    const rect = event.currentTarget.getBoundingClientRect();
    pop.style.top  = (rect.bottom + window.scrollY + 6) + 'px';
    pop.style.left = Math.min(rect.left + window.scrollX, window.innerWidth - 260) + 'px';
    pop.classList.add('open');
  }

  async function applyReviewAdjust(event, days) {
    event.stopPropagation();
    const word = _reviewPopoverWord; if (!word) return;
    let dateStr = '';
    if (days >= 0) {
      const d = new Date(); d.setDate(d.getDate() + days);
      dateStr = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }
    const resp = await fetch(`/api/vocab-words/${encodeURIComponent(word)}/next-review`, {
      method: 'PATCH', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({date: dateStr})
    });
    if (!resp.ok) { alert('更新失败'); return; }
    vocabData[word].next_review = dateStr;
    const card = document.querySelector(`.word-card[data-word="${word}"]`);
    if (card) {
      const st = reviewStatus(vocabData[word]);
      const tag = card.querySelector('.review-tag');
      if (tag) { tag.textContent = st.label; tag.className = `tag ${st.key} review-tag`; }
      card.dataset.status = st.key;
    }
    document.getElementById('review-popover').classList.remove('open');
    _reviewPopoverWord = null;
  }

  document.addEventListener('click', () => {
    document.getElementById('review-popover')?.classList.remove('open');
    _reviewPopoverWord = null;
    closeWordSavePopover();
  });

  async function unmaster(event, word) {
    event.stopPropagation();
    const btn = event.currentTarget;
    btn.disabled = true;
    try {
      await fetch(`/api/known-words/${encodeURIComponent(word)}`, { method: 'DELETE' });
      knownSet.delete(word);
      const card = document.querySelector(`.word-card[data-word="${word}"]`);
      if (card) card.outerHTML = buildCard(word, vocabData[word]);
    } catch(e) { btn.disabled = false; }
  }

  async function init() {
    const [vocabRes, knownArr, healthData, wordlists, todayPlan, recommendations] = await Promise.all([
      fetch('/vocab-log'),
      fetch('/api/known-words').then(r => r.json()).catch(() => []),
      fetch('/health').then(r => r.json()).catch(() => ({})),
      fetch('/api/wordlists/config').then(r => r.json()).catch(() => []),
      fetch('/api/planning/today', {cache:'no-store'}).then(r => r.ok ? r.json() : {}).catch(() => ({})),
      fetch('/api/planning/recommendations/current', {cache:'no-store'}).then(r => r.ok ? r.json() : {}).catch(() => ({}))
    ]);
    const hasAI = healthData?.environment?.keys?.AI_API_KEY === 'configured'
               || healthData?.api_keys?.AI_API_KEY === 'configured';
    window._hasAI = hasAI;
    vocabData = await vocabRes.json();
    knownArr.forEach(w => knownSet.add(w));
    (todayPlan.tasks || []).forEach(task => (task.targets || []).forEach(target => {
      if (target.target_type === 'word' || target.target_type === 'phrase') {
        todayPlanWords.add(String(target.target_ref || '').trim().toLowerCase());
      }
    }));
    (recommendations.pool?.candidates || []).forEach(candidate => {
      if (candidate.target_type === 'word' && ['pending','accepted'].includes(candidate.status)) {
        aiRecommendedWords.add(String(candidate.target_ref || '').trim().toLowerCase());
      }
    });

    renderWordlistFilters(wordlists);

    const entries = Object.entries(vocabData).filter(([w]) => !w.startsWith('__'));
    const vcfg = Object.fromEntries((wordlists || []).map(c => [c.id, c]));
    masteredBase = vcfg.my_mastered?.count || 0;
    updateStatsBadge();

    renderTodayPanel(entries);
    renderList();
  }

  init();
</script>
<div id="review-popover">
  <span>调整复习：</span>
  <button onclick="applyReviewAdjust(event,0)">今天</button>
  <button onclick="applyReviewAdjust(event,1)">明天</button>
  <button onclick="applyReviewAdjust(event,3)">+3天</button>
  <button onclick="applyReviewAdjust(event,7)">+7天</button>
  <button onclick="applyReviewAdjust(event,-1)" style="color:var(--muted)">清除</button>
</div>
<div id="word-save-popover" class="hidden">
  <span style="font-weight:500" id="word-save-label"></span>
  <input id="word-save-tag-input" type="text" placeholder="标签（可空）" maxlength="20">
  <button onclick="confirmSaveWord()" style="font-size:12px;padding:3px 8px">收藏</button>
  <button onclick="closeWordSavePopover()" style="font-size:12px;padding:3px 6px;background:none;border:none;cursor:pointer;color:#9ca3af">✕</button>
</div>
</body>
</html>
